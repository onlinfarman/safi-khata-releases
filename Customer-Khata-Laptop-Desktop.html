<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Customer Khata — کسٹمر کھاتہ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- v6.21 launch: the font stylesheet loads non-blocking (print-media
         trick) so the first paint does not wait for the Google Fonts
         round-trip; the fonts swap in when they arrive (display=swap). -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      :root{
        /* v6.25: whole-app palette = SSC Khata (Farman 2026-11-13).
           --brand is now SSC blue; --good is SSC green for money-in /
           positive amounts (they used to ride on --brand). */
        --bg:#f2f5fa; --surface:#ffffff; --surface2:#eef2ff; --inputbg:#e2e8f0; --ink:#0f172a; --muted:#64748b;
        --line:#e5eaf2; --brand:#2563eb; --brand-dark:#1e40af; --brand-soft:#dbeafe;
        --danger:#dc2626; --danger-soft:#fee2e2; --warn:#f59e0b; --warn-soft:#fef3c7;
        --good:#16a34a; --good-soft:#dcfce7; --purple:#7c3aed; --violet:#6d28d9;
        --slate:#475569; --slate-soft:#e2e8f0; --gold:#f59e0b;
        --shadow:0 6px 18px rgba(15,23,42,.07); --radius:18px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0f172a; --surface:#1e293b; --surface2:#243447; --inputbg:#020617; --ink:#f1f5f9; --muted:#94a3b8;
          --line:#334155; --brand:#3b82f6; --brand-dark:#60a5fa; --brand-soft:#1e3a5f;
          --danger:#ef4444; --danger-soft:#450a0a; --warn:#fbbf24; --warn-soft:#451a03;
          --good:#22c55e; --good-soft:#14532d; --purple:#a855f7; --violet:#8b5cf6;
          --slate:#94a3b8; --slate-soft:#334155;
          --shadow:0 6px 24px rgba(0,0,0,.4);
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
      html[lang="ur"] body{font-family:"Noto Nastaliq Urdu","Public Sans",serif;line-height:2}
      html[lang="ur"] input,html[lang="ur"] select,html[lang="ur"] textarea,html[lang="ur"] button{font-family:inherit}
      button{font-family:inherit;cursor:pointer}
      input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
      .num{font-family:"Public Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.1px}
      html[lang="ur"] .num{line-height:1.5}

      /* Header */
      header.top{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-top)*0);padding-top:calc(10px + env(safe-area-inset-top))}
      .top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
      .brandmark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
      .brandmark svg{width:22px;height:22px}
      .top h1{font-size:19px;margin:0;font-weight:700;line-height:1.3}
      .top-in .titlewrap{min-width:0}
      .top h1,.top .shopsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      html[lang="ur"] .top h1{line-height:1.9}
      .top .shopsub{font-size:12px;opacity:.85;margin-top:-2px}
      .top .sp{flex:1}
      .langbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
      .iconbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
      .iconbtn svg{width:19px;height:19px}

      main{max-width:860px;margin:0 auto;padding:16px 14px 110px}
      .screen{display:none}
      .screen.on{display:block}

      /* Cards & stats */
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
      @media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
      /* v6.25: stat cards = SSC design — white card, soft shadow, centred
         column, coloured icon tile (.sic) on top, small label, bold
         amount. The .val sizes stay (22px / inline 19px) so the v6.24
         one-line fit keeps working; tile colours come from SSC. */
      .stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
      .stat .sic{width:40px;height:40px;min-width:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
      .stat .sic svg{width:20px;height:20px}
      .stat .lab{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
      .stat .val{font-size:22px;font-weight:800;margin-top:0}
      /* v6.24: Dashboard arrangement fix ONLY (Farman 2026-11-13) — the
         "You'll Get" amount wrapped ("Rs" alone on one line, digits on
         the next), making its card taller than its neighbour. Dashboard
         amounts never wrap now, and the row stretch is explicit so
         sibling cards stay equal height. No colour, order, content or
         behaviour change — layout only. */
      .dash{align-items:stretch}
      .dash .val{white-space:nowrap}
      /* v6.25: Dashboard arrangement — compact 3-per-row stat grid like
         the SSC Khata reference (Farman 2026-11-13). One grid holds all
         7 stat cards (3+3+1) with small even gaps, so no half-empty row
         is left over. Layout only — same cards, order, text, colours,
         values. NOTE: not .grid3 — its small-screen media query would
         collapse this to 2 columns on phones. Quick Actions gap
         tightened 10px→8px to match (same look, same 2-per-row).
         v6.26: the v6.25 grid broke on Farman's phone (23:15 PKT) —
         columns were NOT equal and the 3rd card was clipped off the
         right edge. Root cause: repeat(3,1fr) is minmax(auto,1fr), so
         the unbreakable amount ("Rs 1,041,339", white-space:nowrap)
         forced its track wider than its share — and the wider fallback
         font on his phone made it overflow the screen. Fix: minmax(0,1fr)
         so no track can ever exceed its equal share, min-width:0 on the
         cards, amounts capped to their card (see fitDashAmounts), and
         fixed label/value row heights so ALL 6 cards are pixel-equal
         in width AND height on every phone width. (v6.27: Day Expense
         card removed, 6 cards left.) (v6.45: 5 cards — row 1 keeps 3,
         row 2 is its own full-width flex row .dashgrid2 with the
         last 2 cards at half width each, slightly larger; see below.) */
      .dashgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
      .dashgrid .stat{min-width:0}
      /* v6.26: value capped to its card (so fitDashAmounts can measure
         a real overflow and shrink it) + fixed 28px line-height so a
         shrunk amount never changes the card height. Label box is
         always exactly 2 lines tall (11px/1.25), so a 1-line and a
         2-line label give the same card height. Together every card
         is 12+40+6+28+6+28+12 = 132px tall, every row identical. */
      .dashgrid .stat .val{max-width:100%;overflow:hidden;line-height:28px}
      .dashgrid .stat .lab{min-height:28px}
      /* v6.45: bottom row of the Dashboard stat cards (Farman 2026-11-17,
         mockup confirmed) — the 3-per-row grid left "Cash out today" +
         "Total Expense" alone on row 2 with an empty third cell and it
         looked unbalanced. Row 2 is now its own full-width flex row:
         the 2 cards share the row 50/50 (flex:1, min-width:0) and are
         slightly larger than the top-row cards (mockup proportions:
         icon 72 vs 64, label 24 vs 22, amount 38 vs 34 — ~1.1x).
         Same colours, icons, labels and figures; layout only. The
         .val cap + nowrap + fitDashAmounts rules apply here too (the
         row also carries class "dash"). */
      .dashgrid2{display:flex;gap:8px;align-items:stretch}
      .dashgrid2 .stat{flex:1;min-width:0}
      .dashgrid2 .stat .val{max-width:100%;overflow:hidden;line-height:28px}
      .dashgrid2 .stat .lab{min-height:30px;font-size:12px}
      .dashgrid2 .stat .sic{width:45px;height:45px;min-width:45px;border-radius:13px}
      .dashgrid2 .stat .sic svg{width:22px;height:22px}
      .stat .val small{font-size:13px;font-weight:600;color:var(--muted)}
      /* v6.33: per-doctor blocks on the Dashboard (Farman 2026-11-15,
         design confirmed) — 2-column grid of white blocks, same
         surface/border/radius as the other cards; the Total Sale card
         on the doctor sub-dashboard is a full-width blue card. */
      .docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
      .docblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:start;color:var(--ink);cursor:pointer;min-width:0}
      .docblock .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
      .docblock .cnt{font-size:13px;color:var(--muted);display:block;margin-top:2px}
      .docblock .slab{font-size:12px;color:var(--muted);display:block;margin-top:10px}
      .docblock .sval{font-size:21px;font-weight:800;color:var(--brand);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .docsale{background:var(--brand);color:#fff;border-radius:var(--radius);padding:18px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
      .docsale .pdfbtn-green{flex:none;white-space:nowrap}
      .docsale .lab{font-size:13px;opacity:.85}
      .docsale .val{font-size:34px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .docsale .cnt{font-size:13px;opacity:.85;margin-top:6px}
      .pos{color:var(--good)} .neg{color:var(--danger)}
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
      .card h3{margin:0 0 8px;font-size:16px}
      .sec-title{font-size:16px;font-weight:700;margin:20px 2px 8px}

      /* Quick actions */
      .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
      @media(max-width:560px){.quick{grid-template-columns:repeat(2,1fr)}}
      /* v6.25: Quick Actions = SSC solid-colour buttons — big coloured
         button, white icon + white label. Colours are SSC's gradients;
         the class (blue/green/…) is set per action in renderHome. */
      .qbtn{border:0;border-radius:16px;padding:16px 10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:15px;box-shadow:0 6px 14px rgba(15,23,42,.14)}
      .qbtn .qi{display:flex;align-items:center;justify-content:center}
      .qbtn .qi svg{width:24px;height:24px}
      .qbtn.blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}
      .qbtn.green{background:linear-gradient(135deg,#22c55e,#16a34a)}
      .qbtn.red{background:linear-gradient(135deg,#ef4444,#dc2626)}
      .qbtn.orange{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
      .qbtn.purple{background:linear-gradient(135deg,#a855f7,#7c3aed)}
      .qbtn.slate{background:linear-gradient(135deg,#64748b,#475569)}

      /* Lists */
      .rowitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:8px;width:100%;text-align:start;color:var(--ink)}
      button.rowitem{cursor:pointer}
      .avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
      .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
      /* v6.30: party photo picker (Cash Book photo sheet since v6.31;
         was the Add/Edit Party form until Farman removed it there) */
      .pfphoto{display:flex;align-items:center;gap:12px}
      .pfphoto .avatar{width:64px;height:64px;font-size:22px;cursor:pointer;overflow:hidden}
      .pfphoto .pfactions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
      .rowitem .grow{flex:1;min-width:0}
      /* FIX v2 (horizontal overflow on narrow phones): .nm/.sub are spans
         (inline by default), so overflow:hidden + text-overflow:ellipsis
         never applied and a long party/bill name on one nowrap line pushed
         the row wider than the screen (in RTL it spills to the left and
         makes the whole page scroll sideways). As blocks they truncate. */
      .rowitem .nm,.rowitem .sub{display:block}
      .rowitem .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .rowitem .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      /* v6.3: Serial No. + Visit ID lines get their own fully-visible line (never truncated) — v6.21: old party ID removed */
      .rowitem .sub2{display:block;font-size:12px;color:var(--muted);white-space:normal;overflow-wrap:anywhere;line-height:1.35;margin-top:1px}
      /* v6.3: extra inline breathing room so the party avatar is fully inside the card */
      #khataList .rowitem{padding-inline:16px}
      .amt{font-weight:800;font-size:15px;text-align:end}
      .amt small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
      /* v6.55: DigiKhata-style amount block — big amount with the
         direction label on its own line beneath it IN THE SAME colour
         (the old <small> label was forced muted grey, so the will-pay
         side never read as prominently as will-get). */
      .amtblk{display:flex;flex-direction:column;align-items:flex-end;text-align:end;flex:none}
      .amtblk .amt{font-size:17px;font-weight:800;line-height:1.2}
      .amtblk .amtlab{display:block;font-size:12px;font-weight:600;color:inherit;line-height:1.25;white-space:nowrap}
      .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
      .tag.med{background:var(--warn-soft);color:var(--warn)}
      .tag.exp{background:var(--danger-soft);color:var(--danger)}
      .tag.low{background:var(--danger-soft);color:var(--danger)}

      /* Search + segmented */
      .searchbar{display:flex;gap:8px;margin-top:4px}
      .searchbar input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
      .seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-top:12px;align-items:stretch}
      .seg button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:700;font-size:14px;line-height:1.4;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:42px}
      .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
      /* Khata totals strip (v6.3): count + will get + will pay for the active tab */
      .totstrip{display:flex;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
      /* v6.19: the Khata PDF button sits BELOW the totals strip, full
         width (a plain ghost button under the totals). v6.17 had it as a
         badge straddling the strip's top-right corner. */
      .totpdfbtn{margin-top:10px}
      /* v6.18: the single Cash Book PDF button sits on the top-right corner
         of the Cash Book totals card, straddling the card edge like the
         Khata totals-strip button. v6.27: solid purple, white text. */
      .cashstat{position:relative;margin-top:12px}
      .cashstat .cashpdf{position:absolute;top:-9px;right:10px;z-index:2;background:var(--purple);border:1px solid var(--purple);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
      /* v6.18: Cash Book PDF selector — multi-select party checklist. */
      .cbplist{border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;max-height:190px;overflow:auto;background:var(--surface)}
      .cbprow{display:flex;align-items:center;gap:10px;padding:9px 0;font-weight:600;cursor:pointer}
      .cbprow .grow{flex:1;min-width:0}
      .cbprow input{width:18px;height:18px;accent-color:var(--brand)}
      .cbpresets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
      .cbpresets button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;color:var(--ink)}
      .totstrip .tot{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
      .totstrip .tot b{font-size:15px;color:var(--ink);white-space:nowrap}
      .totstrip .tot span{font-size:11.5px;color:var(--muted);font-weight:600}
      .totstrip .tot.get b{color:var(--good)}
      .totstrip .tot.pay b{color:var(--danger)}
      /* v6.55: totals-strip cells are tappable filters (DigiKhata-style) —
         buttons reset to the plain cell look; the active cell gets a filled
         background + a brand underline so the filter is obvious. */
      .totstrip button.tot{background:none;border:0;cursor:pointer;font:inherit;color:inherit;padding:4px 2px;border-radius:10px}
      .totstrip button.tot.on{background:var(--surface2);box-shadow:inset 0 -3px 0 var(--brand)}
      /* v6.56: tappable Dashboard .stat cards (Paid Customers / Paid Amount)
         render exactly like the plain .stat cards — reset the button chrome. */
      .dashgrid2 button.stat{border:0;cursor:pointer;font:inherit;color:inherit}

      /* Buttons */
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14.5px;border:1px solid transparent}
      .btn svg{width:17px;height:17px}
      .btn.primary{background:var(--brand);color:#fff}
      .btn.primary:active{background:var(--brand-dark)}
      .btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
      .btn.danger{background:var(--danger-soft);color:var(--danger)}
      .btn.wa{background:#1faa55;color:#fff}
      .btn.block{width:100%}
      .btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
      /* v6.27: EVERY PDF button is solid purple with white text —
         this class is added to each PDF button (Khata PDF, party
         Print/Share PDF, sheet Make PDF, Reports Total Report). */
      .btn.pdfbtn{background:var(--purple);border-color:var(--purple);color:#fff}
      /* v6.36: the per-doctor PDF button is GREEN (Farman picked Green) so it
         stands out from the usual purple PDF buttons. Same shape, same
         white text — only the colour differs. */
      .btn.pdfbtn-green{background:var(--good);border-color:var(--good);color:#fff}
      .fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-end:18px;z-index:25;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-weight:800;font-size:15px;box-shadow:var(--shadow);display:none;align-items:center;gap:8px}
      .fab svg{width:19px;height:19px}
      .fab.on{display:inline-flex}

      /* Bottom nav */
      nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
      .bottom-in{max-width:860px;margin:0 auto;display:flex}
      .bottom button{flex:1;background:none;border:0;padding:8px 2px 7px;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
      .bottom button svg{width:22px;height:22px}
      .bottom button.on{color:var(--brand)}
      html[lang="ur"] .bottom button{line-height:1.7}

      /* Forms */
      .field{margin-top:12px}
      .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
      /* v6.38: entry inputs darker still (Farman: "boxe tura aur darken
         banaw") — v6.37's var(--bg) was not dark enough. The fill is now
         var(--inputbg): slate-200 #e2e8f0 in light mode (clearly darker
         than the #f2f5fa page tone) and slate-950 #020617 in dark mode
         (darker than the #1e293b sheet). Text stays fully readable in
         both themes; borders unchanged. Search bars (.searchbar) are
         NOT tinted — searching, not entering. */
      .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--inputbg)}
      .field textarea{resize:vertical;min-height:64px}
      /* v6.6: inline form error (party ID validation) — shown by setting style.display="block" */
      .err{display:none;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;margin-top:12px}
      /* v6.7: Share screen — one ON/OFF button per option */
      .togrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
      .togrow:first-child{border-top:0}
      .togrow .toglab{font-weight:700;font-size:14px}
      .tog{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:6px 16px;font-weight:800;font-size:13px;min-width:70px;flex:none}
      .tog.on{background:var(--brand);border-color:var(--brand);color:#fff}
      .sharebar{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:700}
      .sharebar .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
      @media(max-width:560px){.frow3{grid-template-columns:1fr 1fr}}

      /* Modal */

      signingOut = true;

      if(cloudRetryTimer){ clearTimeout(cloudRetryTimer); cloudRetryTimer = null; }

           write failed and the local copy is dirty, KEEP it (and the
           dirty flag) — the next sign-in on this device pushes it up.

        if(synced || !isDirty()){

       them with the same Firestore merge write, and the labels reuse the
       cards' own i18n keys. Default ON for new grants; OLD grants
       predate these keys, so canSeeCard()/cardToggleOn() treat a MISSING
       key as ON — nothing is hidden for an existing share until the
       owner flips a switch. */
    var SHARE_CARD_OPTS = ["cardGet","cardGive","cardTodayIn","cardTodayOut","cardExpense","cardPaidCust","cardPaidAmt"];
    var SHARE_CARD_LABEL = { cardGet:"youllGet", cardGive:"youllGive", cardTodayIn:"todayIn", cardTodayOut:"todayOut", cardExpense:"totalExpense", cardPaidCust:"paidCustomers", cardPaidAmt:"paidTotal" };
    var SHARE_RELEASES_URL = "https://github.com/onlinfarman/safi-khata-releases/releases";
    var myGrants = [];       /* grants I own (I am the owner) */
    var sharePartyQuery = {}; /* v6.25: per-grant party-checklist search text (survives re-renders) */
    var sharedWithMe = [];   /* active grants where I am the grantee */
    var sharedMode = null;   /* {grant, ownerUid, ownerEmail, ownerShop} while viewing someone else's dashboard */
    var ownS = null;         /* my own data, kept in memory while in shared mode */
    var sharedLang = null;   /* my language choice while in shared mode (the owner's language must not change) */
    /* Default toggles for a new grant: everything ON except Delete
       (deleting is destructive, so the owner turns it on deliberately). */
    function shareToggles(){ return { dashboard:true, customers:true, partydetail:true, addEdit:true, del:false, waCall:true, printPdf:true, cardGet:true, cardGive:true, cardTodayIn:true, cardTodayOut:true, cardExpense:true, cardPaidCust:true, cardPaidAmt:true }; }
    /* Deterministic grant doc id: ownerUid + "_" + grantee email (lowercase).
       The Firestore rules look the grant up by exactly this id. */
    function shareGrantId(ownerUid, email){ return ownerUid + "_" + String(email||"").trim().toLowerCase(); }
    /* Visibility / permission gates. In owner mode (sharedMode null) everything is allowed. */
    function canSee(key){ return !sharedMode || !!(sharedMode.grant.toggles && sharedMode.grant.toggles[key]); }
    /* v6.58: per-card gate (see SHARE_CARD_OPTS above) — a MISSING key
       counts as ON, so grants created before v6.58 keep showing every
       card. Owner mode always sees all cards. */
    function canSeeCard(key){ if(!sharedMode) return true; var tg = sharedMode.grant.toggles || {}; if(!(key in tg)) return true; return !!tg[key]; }
    function cardToggleOn(g, key){ var tg = (g && g.toggles) || {}; if(!(key in tg)) return true; return !!tg[key]; }
    function canEdit(){ return !sharedMode || !!(sharedMode.grant.toggles && sharedMode.grant.toggles.addEdit); }
    function canDelete(){ return !sharedMode || !!(sharedMode.grant.toggles && sharedMode.grant.toggles.del); }
    /* v6.24: per-party share scoping (Farman 2026-11-13) — a grant may
       carry `parties`: null/undefined = "All parties" (old grants and
       new shares default to this, so no existing access is lost), or an
       array of party ids = "Selected parties". In shared mode the
       sharee sees ONLY those parties, on both the Khata and the Cash
       Book sides. Owner mode is completely unaffected. */
    function shareGrantParties(){
      if(!sharedMode) return null;
      var g = sharedMode.grant||{};
      if(!g.parties || !Array.isArray(g.parties)) return null;   /* all */
      return g.parties;
    }
    function canSeeParty(pid){
      if(!sharedMode) return true;
      var list = shareGrantParties();
      if(!list) return true;
      /* pid null = the "General" cash party, which belongs to no party —
         hidden when a grant is limited to selected parties. */
      if(!pid) return false;
      return list.indexOf(pid)>-1;
    }

    /* ---------- derived data ---------- */
    function partyBalance(pid){
      var b=0;
      S.ptx.forEach(function(x){ if(x.partyId!==pid) return; if(x.kind==="credit") b+=x.amount; else b-=x.amount; });
      return Math.round(b*100)/100;
    }
    function totals(){
      /* v6.24: in shared mode with a limited grant, the dashboard counts
         reflect ONLY the granted parties (their Khata balances and their
         cash entries); owner mode and all-parties grants are unchanged. */
      var limited = !!sharedMode && !!shareGrantParties();
      var get=0, give=0;
      S.parties.forEach(function(p){ if(limited && !canSeeParty(p.id)) return; var b=partyBalance(p.id); if(p.type==="customer" && b>0) get+=b; if(p.type==="supplier" && b>0) give+=b; if(p.type==="customer" && b<0) give+=-b; if(p.type==="supplier" && b<0) get+=-b; });
      var cin=0, cout=0;
      S.ctx.forEach(function(x){ if(limited && !canSeeParty(cashPartyId(x))) return; if(x.kind==="in") cin+=x.amount; else cout+=x.amount; });
      return { get:get, give:give, cash:cin-cout };
    }
    /* ---------- v6.33: DOCTOR-WISE DASHBOARD ----------
       Groups are DERIVED live from saved Khata parties — there is no
       stored doctor list and no migration: data entered before v6.33
       shows under its doctor as soon as this version ships (retroactive
       by construction). Group key = trimmed lower-case doctor name, so
       "Dr. Khan", "dr. khan" and " Dr. Khan " are ONE block; the display
       name is the first-entered spelling. Patients with no doctor name
       form the "Doctor nahi likha" block, so no data is ever hidden.
       Only Khata CUSTOMERS are grouped (the Khata tab shows customers
       only, v6.14) — Cash Book-only parties carry no doctor name and
       suppliers are not patients. In shared mode a limited grant sees
       only its granted parties (same rule as totals()). */
    function partyGiven(pid){
      var g=0;
      S.ptx.forEach(function(x){ if(x.partyId===pid && x.kind==="credit") g+=x.amount; });
      return Math.round(g*100)/100;
    }
    function partyReceived(pid){
      var r=0;
      S.ptx.forEach(function(x){ if(x.partyId===pid && x.kind!=="credit") r+=x.amount; });
      return Math.round(r*100)/100;
    }
    /* Total Sale for one doctor = the sum of all GIVEN (credit) amounts
       across that doctor's patients. A credit entry is medicine given
       on credit — i.e. a sale; a pay entry is money received back, so
       it is NOT a sale and is excluded. */
    function doctorSale(g){
      var s=0;
      g.parties.forEach(function(p){ s+=partyGiven(p.id); });
      return Math.round(s*100)/100;
    }
    function doctorGroups(){
      var map={}, order=[];
      S.parties.forEach(function(p){
        if(p.type!=="customer" || !isKhataParty(p)) return;
        if(!canSeeParty(p.id)) return;
        var raw=(p.doctorName||"").trim();
        var key=raw?raw.toLowerCase():"";
        if(!map[key]){ map[key]={key:key, name:raw||null, parties:[]}; order.push(key); }
        map[key].parties.push(p);
      });
      /* Named doctors A–Z; the no-doctor block always last. */
      order.sort(function(a,b){
        if(a==="") return 1; if(b==="") return -1;
        var an=map[a].name.toLowerCase(), bn=map[b].name.toLowerCase();
        return an<bn?-1:(an>bn?1:0);
      });
      return order.map(function(k){ return map[k]; });
    }
    /* Doctor key for go() params: URL-encoded so quotes/apostrophes in a
       doctor's name cannot break the onclick string. */
    function doctorKey(key){ return encodeURIComponent(key).replace(/'/g,"%27"); }
    /* ---------- v6.34: DOCTOR SEARCH ----------
       Filters ONLY the doctor blocks on the Dashboard, live as the user
       types: partial match, case-insensitive, trimmed input. Empty query
       shows all blocks. The "Doctor nahi likha" block is matched against
       its displayed label (t("noDoctor")), so typing "nahi" finds it.
       The input lives OUTSIDE the grid container and typing updates ONLY
       the grid (same pattern as khataSearchKeep, v6.7/v6.30) — the input,
       its focus and the full keyboard survive every keystroke. There is
       NO inputmode="numeric" here: the placeholder promises name search
       and a numeric keyboard could not type names (v6.30 lesson). */
    function doctorGridHtml(){
      var q = doctorSearch.trim().toLowerCase();
      var list = doctorGroups();
      if(q) list = list.filter(function(g){ return (g.name||t("noDoctor")).toLowerCase().indexOf(q)>-1; });
      var h = '<div class="docgrid">';
      list.forEach(function(g){
        var gspec = doctorSpecForGroup(g);
        h += '<button class="docblock" onclick="go(\'doctor\',\''+doctorKey(g.key)+'\')"><span class="nm">'+esc(g.name||t("noDoctor"))+'</span>'+(gspec?'<span class="cnt">'+esc(gspec)+'</span>':"")+'<span class="cnt">'+g.parties.length+' '+esc(t("patients"))+'</span><span class="slab">'+esc(t("totalSale"))+'</span><span class="sval num">'+fmt(doctorSale(g))+'</span></button>';
      });
      h += '</div>';
      return h;
    }
    function doctorSearchKeep(inp){
      doctorSearch = inp.value;
      var el = document.getElementById("doctorGrid");
      if(el) el.innerHTML = doctorGridHtml();
    }
    /* ---------- v6.49: MANAGED DOCTOR LIST (Farman 2026-11-19) ----------
       Only the doctors in S.doctors may be saved on a party. Picking one
       auto-fills its specialty (saved on the party as doctorSpec). A name
       that is not in the list is rejected — a wrongly typed word never
       saves. The list lives in the synced data, so it follows the owner
       across devices; removing a doctor never touches existing parties. */
    function ensureDoctors(){
      if(sharedMode) return;
      if(!Array.isArray(S.doctors)) S.doctors = DEFAULT_DOCTORS.map(function(d){ return {name:d.name, spec:d.spec, color:d.color}; });
      if(typeof S.doctorsStrict !== "boolean") S.doctorsStrict = true;
    }
    function doctorList(){
      if(!Array.isArray(S.doctors)){ ensureDoctors(); if(!Array.isArray(S.doctors)) return DEFAULT_DOCTORS; }
      if(!sharedMode) ensureDoctorColors();
      return S.doctors;
    }
    function doctorSpecForName(nm){
      var q = String(nm||"").trim().toLowerCase();
      if(!q) return "";
      var list = doctorList();
      for(var i=0;i<list.length;i++){ if(String(list[i].name||"").trim().toLowerCase()===q) return list[i].spec||""; }
      return "";
    }
    /* Specialty shown for a doctor block: the managed list first, then
       any specialty stored on the block's own parties (legacy). */
    function doctorSpecForGroup(g){
      var s = doctorSpecForName(g.name||"");
      if(s) return s;
      for(var i=0;i<g.parties.length;i++){ if(g.parties[i].doctorSpec) return g.parties[i].doctorSpec; }
      return "";
    }
    /* Null when the name may be saved, {field,msg} when it must not: empty
       is fine (doctor is optional), a listed name is fine, and on edit the
       party's own current doctor is fine even if it left the list. */
    function doctorError(name, selfId){
      var nm = String(name||"").trim();
      if(!nm) return null;
      var q = nm.toLowerCase();
      var list = doctorList();
      for(var i=0;i<list.length;i++){ if(String(list[i].name||"").trim().toLowerCase()===q) return null; }
      if(selfId){ var pp = partyById(selfId); if(pp && String(pp.doctorName||"").trim().toLowerCase()===q) return null; }
      return {field:"pf_doctor", msg:t("doctorUnknown")};
    }
    /* v6.51: whitespace-insensitive doctor-name key — "Dr M . Zaib"
       must match "Dr M. Zaib". The old trim+lowercase check let the
       spaced spelling slip through, so the same doctor saved twice.
       Display names are stored unchanged. */
    function doctorNameKey(nm){ return String(nm||"").replace(/\s+/g,"").toLowerCase(); }
    /* v6.51: CUSTOM DOCTOR PICKER (Farman 2026-11-19) — the native
       <select> cannot show per-option buttons, so the Doctor field in
       the party form is now a readonly display field that opens this
       sheet. v6.52: every doctor row had a small subtle ✎ Edit and ✕
       Delete icon. v6.53 (Farman 2026-11-20): those controls MOVED to
       the Doctors manage sheet (main screen, right of the PDF button)
       — the picker is SELECTION-ONLY now. Each row shows the doctor's
       own colour: a solid dot before the name + the name in that
       colour (v6.53). Row tap selects the doctor.
       doctorPick() (native onchange) retired with the select. */
    function doctorPickSheet(){
      /* The form is a sheet; openSheet replaces its content, so stash
         the unsaved values first (same pattern doctorPick used in
         v6.50 before opening the add-doctor sheet). */
      partyFormDraft = capturePartyFormDraft();
      doctorPickSheetRender();
    }
    function doctorPickSheetRender(){
      var list = doctorList();
      var cur = String((partyFormDraft && partyFormDraft.doctor) || "").trim();
      var inList = list.some(function(d){ return doctorNameKey(d.name)===doctorNameKey(cur); });
      var h = '<h2>'+esc(t("doctorPickTitle"))+'</h2>';
      if(cur && !inList){
        /* Legacy doctor: the draft's current doctor, not in the list —
           shown at the top as the current value, WITHOUT a delete
           button (it lives on the party, not in the list). */
        var curSpec = (partyFormDraft && partyFormDraft.spec) || doctorSpecForName(cur) || "";
        h += '<div class="txrow" onclick="doctorPickSelectLegacy()"><span class="grow"><span class="tt">'+esc(cur)+'</span><span class="ts num" style="display:block">'+esc(curSpec)+'</span></span></div>';
      }
      list.forEach(function(d, i){
        var c = doctorColorOf(d, i);
        h += '<div class="txrow" onclick="doctorPickSelect('+i+')"><span class="grow"><span class="tt" style="color:'+esc(c)+'"><span class="docdot" style="background:'+esc(c)+'"></span>'+esc(d.name)+'</span><span class="ts num" style="display:block">'+esc(d.spec||"")+'</span></span></div>';
      });
      h += '<div class="txrow" onclick="doctorPickAdd()"><span class="grow"><span class="tt">'+esc(t("addDoctor"))+'</span></span></div>';
      h += '<div class="actions"><button class="btn ghost" onclick="doctorPickBack()">'+esc(t("close"))+'</button></div>';
      openSheet(h);
    }
    function doctorPickSelect(i){
      var d = doctorList()[i]; if(!d) return;
      /* Stash the choice in the draft, re-open the party form, then
         set the field + specialty (same pattern
         doctorAddFromFormSave uses). */
      if(partyFormDraft){ partyFormDraft.doctor = d.name; partyFormDraft.spec = d.spec||""; }
      partyForm(partyFormId);
      var s = document.getElementById("pf_doctor"), sp = document.getElementById("pf_spec");
      if(s){ s.value = d.name; prevDoctorValue = d.name; }
      if(sp) sp.value = d.spec||"";
    }
    function doctorPickSelectLegacy(){
      /* The draft already holds the legacy doctor + specialty; just
         re-open the form and let the draft restore it. */
      partyForm(partyFormId);
    }
    function doctorPickDelete(i){
      var list = doctorList();
      if(i<0 || i>=list.length) return;
      var d = list[i];
      confirmSheet(t("doctorDelMsg").replace("{name}", d.name), t("delete"), function(){
        var l2 = doctorList();
        var j = l2.indexOf(d);
        if(j<0) return;
        l2.splice(j,1);
        save();
        /* If the deleted doctor was the one selected in the draft,
           clear the draft selection so the form shows
           "— Select doctor —" on return. Parties are never touched. */
        if(partyFormDraft && doctorNameKey(partyFormDraft.doctor)===doctorNameKey(d.name)){ partyFormDraft.doctor = ""; partyFormDraft.spec = ""; }
        toast(t("deleted"));
        /* confirmSheet's OK button calls closeSheet() after this fn,
           so re-open the sheet we came from on the next tick
           (refreshed list) — the picker, or the Doctors manage sheet
           (v6.53, see doctorReturnTo). */
        setTimeout(function(){ if(doctorReturnTo === "manage") doctorManageSheetRender(); else doctorPickSheetRender(); }, 0);
      });
    }
    function doctorPickAdd(){
      /* Draft already stashed by doctorPickSheet; after save the form
         re-opens with the new doctor selected, as today. */
      doctorAddFromForm();
    }
    /* v6.52: edit a doctor from the picker (Farman 2026-11-20). Same
       small form as the add-doctor sheet, prefilled with the current
       name + specialty; both fields required, duplicates refused via
       doctorNameKey() (except the doctor being edited). The managed
       list entry is updated; parties keep their stored doctor + spec.
       v6.53: edit moved to the Doctors manage sheet (the picker is
       selection-only now) — doctorReturnTo ("pick" | "manage") says
       which sheet to re-open after save/cancel. The form also has a
       colour row: the 8 palette swatches, current colour pre-selected
       (v6.53); saving stores the picked colour on the record. */
    var doctorPickEditDoc = null;
    var doctorPickEditColor = "";
    var doctorReturnTo = "pick";
    function doctorPickEdit(i){
      var list = doctorList();
      if(i<0 || i>=list.length) return;
      doctorPickEditDoc = list[i];
      doctorPickEditColor = doctorColorOf(doctorPickEditDoc, i);
      openSheet(
        '<h2>'+esc(t("doctorEdit"))+'</h2>'
        + '<div class="field"><label>'+esc(t("doctorName"))+'</label><input id="de_name" type="text" value="'+esc(doctorPickEditDoc.name)+'"></div>'
        + '<div class="field"><label>'+esc(t("doctorSpec"))+'</label><input id="de_spec" type="text" value="'+esc(doctorPickEditDoc.spec||"")+'"></div>'
        + '<div class="field"><label>'+esc(t("doctorColor"))+'</label><div class="docswatches">' + DOCTOR_COLORS.map(function(c){ return '<button type="button" class="docswatch'+(c===doctorPickEditColor?' on':'')+'" style="background:'+c+'" data-color="'+c+'" onclick="doctorPickEditColorPick(\''+c+'\')" aria-label="'+esc(c)+'"></button>'; }).join("") + '</div></div>'
        + '<div id="de_err" class="err"></div>'
        + '<div class="actions"><button class="btn ghost" onclick="doctorPickEditCancel()">'+esc(t("cancel"))+'</button><button class="btn primary" onclick="doctorPickEditSave()">'+esc(t("save"))+'</button></div>'
      );
    }
    function doctorPickEditColorPick(c){
      if(!doctorColorValid(c)) return;
      doctorPickEditColor = c.toLowerCase();
      var els = document.querySelectorAll(".docswatch");
      for(var i=0;i<els.length;i++){ if(els[i].getAttribute("data-color")===doctorPickEditColor) els[i].classList.add("on"); else els[i].classList.remove("on"); }
    }
    function doctorPickEditCancel(){
      /* Back to the sheet we came from, list unchanged (draft still
         stashed when coming from the picker). */
      doctorPickEditDoc = null;
      if(doctorReturnTo === "manage") doctorManageSheetRender(); else doctorPickSheetRender();
    }
    function doctorPickEditSave(){
      var d = doctorPickEditDoc;
      if(!d){ doctorPickSheetRender(); return; }
      var nmEl = document.getElementById("de_name"), spEl = document.getElementById("de_spec");
      var nm = nmEl ? nmEl.value.trim() : "";
      var sp = spEl ? spEl.value.trim() : "";
      var e = document.getElementById("de_err");
      function fail(msg){ if(e){ e.style.display="block"; e.textContent=msg; } }
      if(!nm){ fail(t("fillName")); return; }
      if(!sp){ fail(t("fillSpec")); return; }
      var list = doctorList();
      /* Duplicate refused (whitespace-insensitive), except the doctor
         being edited itself. */
      for(var i=0;i<list.length;i++){ if(list[i]!==d && doctorNameKey(list[i].name)===doctorNameKey(nm)){ fail(t("doctorDup")); return; } }
      var oldKey = doctorNameKey(d.name);
      d.name = nm; d.spec = sp;
      if(doctorColorValid(doctorPickEditColor)) d.color = doctorPickEditColor;
      save();
      /* If the edited doctor was the draft selection, follow the rename
         so the form shows the new name on return. Parties untouched. */
      if(partyFormDraft && doctorNameKey(partyFormDraft.doctor)===oldKey){ partyFormDraft.doctor = nm; partyFormDraft.spec = sp; }
      doctorPickEditDoc = null;
      toast(t("saved"));
      if(doctorReturnTo === "manage") doctorManageSheetRender(); else doctorPickSheetRender();
    }
    function doctorPickBack(){
      partyForm(partyFormId);
    }
    /* v6.53: DOCTORS MANAGEMENT SHEET (Farman 2026-11-20) — opened
       from the "Doctors" button on the main Khata screen (right of
       the PDF button). The edit + delete controls the picker used to
       have (v6.52) live here now: the SAME prefilled edit form
       (name + specialty + colour swatches) and the SAME confirm-first
       delete. Parties are never touched. Owner-only: the button that
       opens this sheet is hidden in shared/guest mode. */
    function doctorManageSheet(){
      doctorManageSheetRender();
    }
    function doctorManageSheetRender(){
      var list = doctorList();
      var h = '<h2>'+esc(t("doctorsTitle"))+'</h2>';
      h += '<p class="hint" style="margin-top:0">'+esc(t("doctorsText"))+'</p>';
      list.forEach(function(d, i){
        var c = doctorColorOf(d, i);
        h += '<div class="txrow"><span class="grow"><span class="tt" style="color:'+esc(c)+'"><span class="docdot" style="background:'+esc(c)+'"></span>'+esc(d.name)+'</span><span class="ts num" style="display:block">'+esc(d.spec||"")+'</span></span>'
          + '<button class="docedit" onclick="doctorManageEdit('+i+')" aria-label="'+esc(t("edit"))+'">✎</button>'
          + '<button class="docdel" onclick="doctorManageDelete('+i+')" aria-label="'+esc(t("delete"))+'">✕</button></div>';
      });
      h += '<div class="actions"><button class="btn ghost" onclick="closeSheet()">'+esc(t("close"))+'</button></div>';
      openSheet(h);
    }
    function doctorManageEdit(i){
      doctorReturnTo = "manage";
      doctorPickEdit(i);
    }
    function doctorManageDelete(i){
      doctorReturnTo = "manage";
      doctorPickDelete(i);
    }
    /* v6.50: the party form is a sheet (openSheet replaces its content),
       so opening the add-doctor sheet would lose the unsaved form values.
       partyFormDraft stashes them (plus the party id being edited and the
       doctor selected before the pick); partyForm() restores them when it
       re-opens. */
    var partyFormId = "";
    var prevDoctorValue = "";
    var partyFormDraft = null;
    function capturePartyFormDraft(){
      function v(id){ var el = document.getElementById(id); return el ? el.value : ""; }
      return { id:partyFormId, sr:v("pf_sr"), visit:v("pf_visit"), patient:v("pf_patient"), father:v("pf_father"), doctor:prevDoctorValue, spec:v("pf_spec"), open:v("pf_open") };
    }
    function restorePartyFormDraft(){
      if(!partyFormDraft) return;
      var d = partyFormDraft; partyFormDraft = null;
      function set(id, val){ var el = document.getElementById(id); if(el && val !== undefined) el.value = val; }
      set("pf_sr", d.sr); set("pf_visit", d.visit); set("pf_patient", d.patient); set("pf_father", d.father);
      var s = document.getElementById("pf_doctor");
      if(s && d.doctor !== undefined){ s.value = d.doctor; prevDoctorValue = d.doctor; }
      set("pf_spec", d.spec);
      set("pf_open", d.open);
      if(d.open && typeof showCalcTotal === "function"){ try{ showCalcTotal(d.open, "pf_total"); }catch(e){} }
    }
    function doctorAddFromForm(){
      /* v6.50: add a doctor straight from the party form (Farman
         2026-11-19). Both fields required; duplicate names refused. The
         strict toggle is NOT touched — it keeps gating the add form in
         Settings > Doctors only. */
      openSheet(
        '<h2>'+esc(t("doctorAdd"))+'</h2>'
        + '<div class="field"><label>'+esc(t("doctorName"))+'</label><input id="df_name" type="text"></div>'
        + '<div class="field"><label>'+esc(t("doctorSpec"))+'</label><input id="df_spec" type="text"></div>'
        + '<div id="df_err" class="err"></div>'
        + '<div class="actions"><button class="btn ghost" onclick="doctorAddFromFormCancel()">'+esc(t("cancel"))+'</button><button class="btn primary" onclick="doctorAddFromFormSave()">'+esc(t("save"))+'</button></div>'
      );
    }
    function doctorAddFromFormCancel(){
      /* Back to the party form with the stashed values restored. */
      partyForm(partyFormId);
    }
    function doctorAddFromFormSave(){
      var nmEl = document.getElementById("df_name"), spEl = document.getElementById("df_spec");
      var nm = nmEl ? nmEl.value.trim() : "";
      var sp = spEl ? spEl.value.trim() : "";
      var e = document.getElementById("df_err");
      function fail(msg){ if(e){ e.style.display="block"; e.textContent=msg; } }
      if(!nm){ fail(t("fillName")); return; }
      if(!sp){ fail(t("fillSpec")); return; }
      var list = doctorList();
      /* v6.51: whitespace-insensitive check — "Dr M . Zaib" must match
         "Dr M. Zaib" (see doctorNameKey). */
      for(var i=0;i<list.length;i++){ if(doctorNameKey(list[i].name)===doctorNameKey(nm)){ fail(t("doctorDup")); return; } }
      list.push({name:nm, spec:sp, color:nextDoctorColor()});
      save();
      /* Re-open the party form, restore the stashed values, then select
         the new doctor and auto-fill its specialty. */
      if(partyFormDraft) partyFormDraft.doctor = nm;
      partyForm(partyFormId);
      var s = document.getElementById("pf_doctor"), spField = document.getElementById("pf_spec");

    function partyById(id){ for(var i=0;i<S.parties.length;i++) if(S.parties[i].id===id) return S.parties[i]; return null; }
    /* ---------- v6.23: Cash Book / Khata separation ----------
       Cash Book and Khata are COMPLETELY separate. A party belongs to
       the tab it was created in, tracked by p.createdIn ("khata" |
       "cash" | "both"). Creation sets it: Khata Add Party -> "khata",
       Cash Book quick-add -> "cash". Legacy parties (no createdIn)
       are migrated once on load (migrateScopes, guarded by the
       S._scopeMigrated flag in the synced data): entries in Khata
       only -> "khata", Cash Book only -> "cash", both -> "both",
       no entries at all -> "khata" (the app began as Khata-only).
       The predicates below ALSO encode the legacy inference, so a
       record that has never been migrated (e.g. shared-mode viewing
       of an older owner's data) still shows in the right tab.
       Amounts were already separated: partyBalance/totals read S.ptx
       only (a Cash Book entry can never change a Khata balance) and
       Cash in Hand reads S.ctx only. v6.23 had ONE deliberate exception:
       the cash mirror of a Khata payment (ptxSave kind "pay" created
       a ctx entry, category "khata", ptxId-linked). v6.29 REMOVES that
       exception: a Khata payment creates NO Cash Book entry any more,
       and the predicates below no longer let entries pull a party
       into the other tab — a party is in a tab ONLY because its
       createdIn scope says so (legacy never-migrated records still
       infer from their entries, as before). LEGACY mirrors already
       in the data (category "khata", ptxId-linked) are NOT deleted:
       they are real cash received, so they stay counted in Cash in
       Hand; they simply cannot surface their Khata party in any
       Cash Book list any more. ptxDelete still removes a linked
       mirror when its ledger entry is deleted. */
    function hasKhataEntries(pid){ return S.ptx.some(function(x){ return x.partyId===pid; }); }
    function hasCashEntries(pid){ return S.ctx.some(function(x){ return cashPartyId(x)===pid; }); }
    function isKhataParty(p){
      if(!p) return false;
      if(p.createdIn==="khata" || p.createdIn==="both") return true;
      if(p.createdIn==="cash") return false;
      /* Legacy, never migrated: Khata unless it has cash entries only. */
      return hasKhataEntries(p.id) || !hasCashEntries(p.id);
    }
    function isCashParty(p){
      if(!p) return false;
      if(p.createdIn==="cash" || p.createdIn==="both") return true;
      if(p.createdIn==="khata") return false;
      /* Legacy, never migrated: Cash only if it has cash entries. */
      return hasCashEntries(p.id);
    }
    function migrateScopes(){
      var changed = false;
      S.parties.forEach(function(p){
        if(p.createdIn) return;
        var kh = hasKhataEntries(p.id), ca = hasCashEntries(p.id);
        p.createdIn = (kh && ca) ? "both" : (ca ? "cash" : "khata");
        changed = true;
      });
      S._scopeMigrated = true;
      return changed;
    }
    function ensureScopesMigrated(){
      /* Owner mode only — in shared mode the data is the owner's; the
         owner's own device migrates it, and a viewer must never write
         the owner's record as a side effect of opening it. */
      if(sharedMode || S._scopeMigrated) return;
      var changed = migrateScopes();
      if(changed) save();
      else { try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
    }
    /* ---------- v6.46: DATA SEPARATION — strip the Cash Book slice ----------
       Khata data only in Customer Khata, Cash Book data only in the Safi
       Khata app. The Cash Book app (v1.3) copies the Cash Book slice out
       of this doc into the cashbook doc and then sets the migration
       marker. THIS app only ever REMOVES the cash slice — and only
       after that marker is set. Without the marker the Cash Book app
       has not copied yet, so stripping would LOSE data. Runs at boot
       and after every cloud pull, until the slice is gone. Owner mode
       only — a shared-mode viewer must never write the owner's record
       as a side effect of opening it.
       v6.47: MARKER LOCATION — v1.3 writes the marker as TOP-LEVEL
       fields on this doc (cashbookMigrated / cashbookMigratedAt), NOT
       inside the data JSON. v6.46 only read S.cashbookMigrated, so the
       strip never fired. applyDocMarker (below) accepts EITHER
       location and copies a top-level marker into S, so the next save
       persists it into the data JSON too. */
    function trashHasCash(it){
      if(!it) return false;
      if(Array.isArray(it.ctx) && it.ctx.length>0) return true;
      if(it.kind==="cashEntry") return true;
      if(it.party && it.party.createdIn==="cash") return true;
      return false;
    }
    function trashIsCashOnly(it){
      if(!it) return false;
      if(Array.isArray(it.ptx) && it.ptx.length>0) return false;
      if(it.kind==="cashEntry") return true;
      if(Array.isArray(it.ctx) && it.ctx.length>0) return true;
      if(it.party && it.party.createdIn==="cash") return true;
      return false;
    }
    function cashSlicePresent(){
      if(!S) return false;
      if(Array.isArray(S.ctx) && S.ctx.length>0) return true;
      if(Array.isArray(S.customCats) && S.customCats.length>0) return true;
      if(S.parties.some(function(p){ return p.createdIn==="cash" || p.createdIn==="both" || (!p.createdIn && !hasKhataEntries(p.id)); })) return true;
      if(Array.isArray(S.trash) && S.trash.some(function(it){ return trashHasCash(it); })) return true;
      return false;
    }
    /* v6.47: accept the migration marker from EITHER location — the
       top-level fields on the khata doc (where the Cash Book app v1.3
       writes them with a merge) or S.cashbookMigrated inside the data
       JSON (where v6.46 looked). Once a top-level marker is seen it is
       copied into S, so the existing strip gate works unchanged and the
       next save persists it into the data JSON, making both locations
       agree. Returns true when the marker was newly applied from the
       top-level field. Never clears a marker that is already set. */
    function applyDocMarker(d){
      if(!S || !d || d.cashbookMigrated !== true) return false;
      var newly = (S.cashbookMigrated !== true);
      S.cashbookMigrated = true;
      if(typeof d.cashbookMigratedAt === "number" && d.cashbookMigratedAt > 0) S.cashbookMigratedAt = d.cashbookMigratedAt;
      else if(!S.cashbookMigratedAt) S.cashbookMigratedAt = 0;
      return newly;
    }
    function stripCashSlice(){
      /* Returns true when anything was removed. Never call without the
         marker check in maybeStripCashSlice. */
      if(sharedMode || !S || S.cashbookMigrated !== true) return false;
      var changed = false;
      /* Which parties had Cash Book entries — captured BEFORE ctx is
         emptied, so a legacy party (no createdIn) that only ever had
         cash entries is still recognised as a cash party below. */
      var cashIds = {};
      (S.ctx||[]).forEach(function(x){ var pid = cashPartyId(x); if(pid) cashIds[pid] = true; });
      if(Array.isArray(S.ctx) && S.ctx.length>0){ S.ctx = []; changed = true; }
      if(Array.isArray(S.customCats) && S.customCats.length>0){ S.customCats = []; changed = true; }
      var before = S.parties.length;
      S.parties = S.parties.filter(function(p){
        if(hasKhataEntries(p.id)) return true;   /* Khata side keeps it */
        if(p.createdIn==="khata") return true;   /* fresh Khata party, no entries yet */
        if(p.createdIn==="cash") return false;   /* cash-only: gone */
        if(p.createdIn==="both") return false;   /* no ptx left: cash-only in effect */
        return !cashIds[p.id];                   /* legacy: keep unless it was a cash party */
      });
      if(S.parties.length !== before) changed = true;
      S.parties.forEach(function(p){ if(p.createdIn==="both"){ p.createdIn = "khata"; changed = true; } });
      if(Array.isArray(S.trash)){
        var tBefore = S.trash.length, tChanged = false;
        S.trash = S.trash.filter(function(it){
          if(trashIsCashOnly(it)){ tChanged = true; return false; }
          if(Array.isArray(it.ctx) && it.ctx.length>0){ it.ctx = []; tChanged = true; }
          return true;
        });
        if(S.trash.length !== tBefore || tChanged) changed = true;
      }
      return changed;
    }
    function maybeStripCashSlice(){
      if(sharedMode || !S || S.cashbookMigrated !== true) return;
      if(stripCashSlice()) save();
    }
    /* ---------- v6.35: TRASH (30-day restore) ----------
       Every delete in the app moves the removed objects into S.trash
       instead of dropping them. A trashed item stays 30 days from its
       deletion time, then is permanently deleted automatically (purge
       runs at boot and whenever Settings — where Trash lives — renders).
       Trashed items live ONLY in S.trash: they are out of S.parties /
       S.ptx / S.ctx, so every total, balance, list and report excludes
       them by construction, with no change to any totals code.
       A trash item snapshots exactly what its delete removed:
         party        — partyDelete / cashPartyDelete: the party object
                        (deep copy — the live party may stay as a
                        cash-only / khata-only record) + the removed
                        ptx and/or ctx entries.
         entry        — ptxDelete: the ledger entry + its linked Cash
                        Book mirrors (ptxId), so Cash in Hand is
                        restored exactly too.
         cashEntry    — cashDelete: the single Cash Book entry.
       Restore puts each object back exactly as it was (dedupe by id,
       so a double restore can never duplicate), recomputes the
       party's createdIn from the entries actually present, and
       removes the item from Trash. */
    function trashClone(o){ return JSON.parse(JSON.stringify(o)); }
    function trashAdd(item){ if(!Array.isArray(S.trash)) S.trash = []; S.trash.push(item); }
    function trashPurge(){
      if(!Array.isArray(S.trash)){ S.trash = []; return false; }
      var cut = Date.now() - TRASH_MS;
      var before = S.trash.length;
      S.trash = S.trash.filter(function(it){ return it.deletedAt > cut; });
      return S.trash.length !== before;
    }
    function trashDaysLeft(it){ var left = it.deletedAt + TRASH_MS - Date.now(); return Math.max(0, Math.ceil(left/86400000)); }
    function trashKindLabel(it){ return it.kind==="party" ? t("trashParty") : (it.kind==="entry" ? t("trashEntry") : t("trashCashEntry")); }
    function trashRestore(id){
      if(sharedMode && !canDelete()){ toast(t("shareNotAllowed")); return; }
      var it = null;
      for(var i=0;i<S.trash.length;i++) if(S.trash[i].id===id){ it = S.trash[i]; break; }
      if(!it) return;
      function back(arr, obj){ if(!obj) return; var found = false; for(var j=0;j<arr.length;j++) if(arr[j].id===obj.id){ found = true; break; } if(!found) arr.push(obj); }
      if(it.party && !partyById(it.party.id)){
        var rp = trashClone(it.party);
        /* v6.40: restoring must never resurrect a duplicate serial — if
           another live party took the serial meanwhile, give the
           restored party a fresh one instead of blocking later saves.
           v6.42: scoped — only a holder in the restored party's own
           section(s) counts (a Khata 82 + Cash Book 82 coexist). */
        var rpScopes = [];
        if(rp.type === "supplier") rpScopes = ["khata", "cash"];
        else { if(isKhataParty(rp)) rpScopes.push("khata"); if(isCashParty(rp)) rpScopes.push("cash"); }
        if(normSerial(rp.serialNo) && rpScopes.some(function(sc){ return findSerialHolder(normSerial(rp.serialNo), rp.id, sc); })) rp.serialNo = nextSerialForParty(rp);
        S.parties.push(rp);
      }
      (it.ptx||[]).forEach(function(x){ back(S.ptx, x); });
      (it.ctx||[]).forEach(function(x){ back(S.ctx, x); });
      if(it.party){
        var p = partyById(it.party.id);
        if(p){
          /* Recompute the scope from the entries actually present now
             (mirrors count too, via hasCashEntries) — so restoring a
             Khata-side delete of a both-sides party lands on "both",
             and a party restored with only one side lands on that side. */
          var kh = hasKhataEntries(p.id), ca = hasCashEntries(p.id);
          if(kh && ca) p.createdIn = "both";
          else if(kh) p.createdIn = "khata";
          else if(ca) p.createdIn = "cash";
          else p.createdIn = it.party.createdIn;
        }
      }
      S.trash = S.trash.filter(function(x){ return x.id!==id; });
      save(); toast(t("trashRestored")); render();
    }
    function trashDeleteForever(id){
      if(sharedMode && !canDelete()){ toast(t("shareNotAllowed")); return; }
      confirmSheet(t("trashForeverQ"), t("delete"), function(){
        S.trash = S.trash.filter(function(x){ return x.id!==id; });
        save(); toast(t("deleted")); render();
      });
    }

    var view = { name:"home", param:null };
    /* Back navigation (v6.4): sub-views remember where they came from, so
       the Android Back key can step back instead of exiting the app. */
    var viewStack = [];
    var SUB_VIEWS = {party:"khata", reports:"home", settings:"home", share:"settings", doctor:"home", doctors:"settings"};
    var khataTab = "customer", reportPeriod = "month", reportFrom="", reportTo="";
    var khataSearch = "";
    /* v6.55: totals-strip direction filter — "all" | "get" | "pay". Default
       "all" (whole list). Set by tapping the strip cells; cleared by
       tapping the active cell again or the Customers count cell. */
    var khataDirFilter = "all"; /* v6.56: "paid" added — Dashboard Paid cards */
    var doctorSearch = ""; /* v6.34: Dashboard doctor search text (survives re-renders, like khataSearch) */
    var app = document.getElementById("app");
    var fab = document.getElementById("fab");

    function go(name, param){
      var prev = view;
      if(SUB_VIEWS[name]){
        if(!prev || prev.name!==name || prev.param!==param){
          viewStack.push(prev);
          if(viewStack.length>20) viewStack.shift();
        }
      } else {
        viewStack = [];
      }
      view = { name:name, param:(param||null) }; render(); animateView(); window.scrollTo(0,0);
    }
    /* Called by the Android shell on Back. Returns true when the press was
       consumed here (open sheet closed, or stepped back to the previous
       view); false means the shell should run its own back/exit behaviour. */
    function handleBack(){
      var ov = document.getElementById("overlay");
      if(ov && ov.className.indexOf("on")>-1){ closeSheet(); return true; }
      if(viewStack.length){
        view = viewStack.pop();
        render(); animateView(); window.scrollTo(0,0);
        return true;
      }
      /* v6.7: in shared mode Back on the top view leaves the shared
         dashboard instead of exiting the app. */
      if(sharedMode){ exitShared(); return true; }
      return false;
    }
    function render(){
      document.documentElement.lang = L();
      document.documentElement.dir = (L()==="ur") ? "rtl" : "ltr";
      document.getElementById("appTitle").textContent = t("appName");
      document.getElementById("shopSub").textContent = S.settings.shop || "";
      document.getElementById("langToggle").textContent = (L()==="ur") ? "EN" : "اردو";
      var nav = [
        ["home", t("dashboard"), "home"], ["khata", t("khata"), "book"]
      ];
      /* v6.13: Stock and Sale removed entirely — the bottom nav is now
         home / khata only. In shared mode the nav shows ONLY the
         ON sections, and OFF sections vanish entirely. */
      if(sharedMode){
        nav = nav.filter(function(n){
          if(n[0]==="home") return true;
          if(n[0]==="khata") return canSee("customers");
          return false;
        });
      }
      /* v6.7: the viewer never sees Settings (and therefore never the
         Share screen or backup/erase — those would touch the owner's data). */
      var sb = document.getElementById("settingsBtn"); if(sb) sb.style.display = sharedMode ? "none" : "";
      document.getElementById("bottomNav").innerHTML = nav.map(function(n){
        var on = (view.name===n[0] || (n[0]==="khata" && view.name==="party") || (n[0]==="home" && view.name==="doctor")) ? " on" : "";
        return '<button type="button" class="'+on.trim()+'" onclick="go(\''+n[0]+'\')">'+ic(n[2])+'<span>'+esc(n[1])+'</span></button>';
      }).join("");
      fab.className = "fab"; fab.innerHTML = "";
      fab.onclick = null;
      /* v6.7: in shared mode, forbidden views fall back to a visible one.
         This runs BEFORE dispatch (not as go() calls inside the render
         functions, which would nest a second render and double the
         shared-mode banner prepended below). */
      if(sharedMode){
        if(["reports","settings","share"].indexOf(view.name)>-1) view = { name:"home", param:null };
        else if(view.name==="party" && !canSee("partydetail")) view = { name:"khata", param:null };
        else if(view.name==="party" && !partyById(view.param)) view = { name:"khata", param:null };
        /* v6.24: a shared viewer can only open a granted party's detail
           (Khata or Cash Book); anything else falls back to the list. */
        else if(view.name==="party" && !canSeeParty(view.param)){ toast(t("shareNotYourKhata")); view = { name:"khata", param:null }; }
        else if(view.name==="khata" && !canSee("customers")) view = { name:"home", param:null };
        else if(view.name==="doctor" && !canSee("dashboard")) view = { name:"home", param:null };
      }
      if(view.name==="home") renderHome();
      else if(view.name==="khata") renderKhata();
      else if(view.name==="party") renderParty(view.param);
      else if(view.name==="doctor") renderDoctor(view.param);
      else if(view.name==="reports") renderReports();
      else if(view.name==="settings") renderSettings();
      else if(view.name==="share") renderShare();
      else if(view.name==="doctors") renderDoctors();
      /* v6.13: Stock/Sale views are gone — any unknown view (e.g. a stale
         deep link) falls back to the dashboard instead of a blank screen. */
      else renderHome();
      /* v6.7: in shared mode every view carries a banner naming the owner
         and a way out of the shared view. */
      if(sharedMode){
        app.innerHTML = '<div class="sharebar"><span class="sp">'+esc(t("viewingShared"))+' — '+esc(sharedMode.ownerShop || sharedMode.ownerEmail)+'</span><button class="btn sm ghost" onclick="exitShared()">'+esc(t("exitShared"))+'</button></div>' + app.innerHTML;
      }
    }

    /* ---------- v6.36: PER-DOCTOR PDF REPORT ----------
       Farman 2026-11-15 (from his screenshot of a doctor's sub-dashboard):
       "balance ky sath pdf ka option ho" — a PDF button on the doctor's
       sub-dashboard next to the Total Sale card, GREEN (he picked Green;
       the usual PDF buttons are purple, v6.27). "Pdf report my kisi ik
       doctor ka bhi karsako" — the report covers that ONE doctor only,
       with a period selector: DAY / WEEKLY / MONTHLY / CUSTOM RANGE.
       "Pdf acha sa dikhay dy" — the PDF must look nice: clean layout,
       doctor name on top, the chosen period, one row per patient (name,
       Sr, Visit ID, given/received in the period, current balance),
       totals at the bottom. Built on the existing v6.15 PDF machinery
       (pdfDoc / pdfTable / shareReportPdf, jsPDF, English labels — jsPDF
       cannot render Urdu) and the v6.18 Cash Book preset pattern (pill
       buttons Today / This week / This month + From/To date inputs);
       no second PDF engine. Period meanings, same as cbPreset: Day =
       today only; Week = last 7 days (today − 6 → today); Month = the
       1st of this month → today; Custom = the two picked dates (if From
       is after To they are swapped so From is always first; both empty
       means no date limit). Only patients WITH an entry inside the
       period get a row; their Given/Received are the period sums and
       their Balance is the current outstanding balance (partyBalance),
       so the totals stay honest: Total Sale = period Given (credit =
       sale, v6.33 rule), Total Received = period pay, Balance = what
       the listed patients still owe in total. */
    var EN_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    function doctorPdfPreset(kind){
      var f = document.getElementById("dr_from"), to = document.getElementById("dr_to");
      if(!f || !to) return;
      var ts = todayStr();
      if(kind==="today"){ f.value = ts; to.value = ts; }
      else if(kind==="week"){ var d=new Date(); d.setDate(d.getDate()-6); f.value = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); to.value = ts; }
      else if(kind==="month"){ var p=ts.split("-"); f.value = p[0]+"-"+p[1]+"-01"; to.value = ts; }
      else { f.value = ""; to.value = ""; } /* custom: he picks both dates */
    }
    function doctorPeriodKind(from, to){
      if(!from && !to) return "all";
      if(from && from===to) return "day";
      var ts = todayStr();
      if(from && to===ts){
        var p = ts.split("-");
        if(from===p[0]+"-"+p[1]+"-01") return "month";
        var d = new Date(); d.setDate(d.getDate()-6);
        var wk = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        if(from===wk) return "week";
      }
      return "custom";
    }
    function doctorPeriodLabel(from, to){
      var kind = doctorPeriodKind(from, to);
      if(kind==="all") return tl("en","allDates");
      if(kind==="day") return (from===todayStr() ? tl("en","today") : "Day") + ": " + dstr(from);
      if(kind==="week") return tl("en","thisWeek") + ": " + dstr(from) + " to " + dstr(to);
      if(kind==="month"){ var p = from.split("-"); return tl("en","thisMonth") + ": " + EN_MONTHS[parseInt(p[1],10)-1] + " " + p[0]; }
      return tl("en","custom") + ": " + dstr(from) + " to " + dstr(to);
    }
    function openDoctorPdfSheet(encKey){
      if(sharedMode && !canSee("printPdf")){ toast(t("shareNotAllowed")); return; }
      var key="";
      try{ key=decodeURIComponent(encKey||""); }catch(e){ key=encKey||""; }
      var g=null;

      var h = '<h2>'+esc(t("doctorPdfTitle"))+' — '+esc(g.name||t("noDoctor"))+'</h2>'
        + '<div class="field"><label>'+esc(t("period"))+'</label><div class="cbpresets">'
        + '<button type="button" onclick="doctorPdfPreset(\'today\')">'+esc(t("today"))+'</button>'
        + '<button type="button" onclick="doctorPdfPreset(\'week\')">'+esc(t("thisWeek"))+'</button>'
        + '<button type="button" onclick="doctorPdfPreset(\'month\')">'+esc(t("thisMonth"))+'</button>'
        + '<button type="button" onclick="doctorPdfPreset(\'custom\')">'+esc(t("custom"))+'</button>'
        + '</div><div class="frow"><div class="field"><label>'+esc(t("fromDate"))+'</label><input id="dr_from" type="date"></div>'
        + '<div class="field"><label>'+esc(t("toDate"))+'</label><input id="dr_to" type="date"></div></div></div>'
        + '<div class="actions"><button class="btn ghost" onclick="closeSheet()">'+esc(t("cancel"))+'</button><button class="btn primary pdfbtn-green" onclick="shareDoctorPdf(\''+doctorKey(key)+'\')">'+esc(t("makePdf"))+'</button></div>';

    /* Read the selector sheet. Returns null when the sheet is not open.
       from/to: "" = no limit. From is always <= To (swapped if needed). */
    function doctorPdfSel(){
      var f = document.getElementById("dr_from"), to = document.getElementById("dr_to");
      if(!f || !to) return null;
      var from = f.value || "", t = to.value || "";
      if(from && t && from > t){ var tmp = from; from = t; t = tmp; }
      return { from: from, to: t };
    }
    function doctorReportData(key, sel){
      sel = sel || { from:"", to:"" };
      var g=null;
      doctorGroups().forEach(function(x){ if(x.key===key) g=x; });
      if(!g) return null;
      /* v6.39: same DESC Serial No. order as the sub-dashboard rows. */
      var list=g.parties.slice().sort(function(a,b){ var an=parseFloat(a.serialNo), bn=parseFloat(b.serialNo); var aNum=!isNaN(an), bNum=!isNaN(bn); if(aNum&&bNum) return bn-an; if(aNum) return -1; if(bNum) return 1; var as=String(a.serialNo||""), bs=String(b.serialNo||""); if(!as&&!bs) return 0; if(!as) return 1; if(!bs) return -1; return bs.localeCompare(as); });
      var rows=[], totGiven=0, totReceived=0, totBalance=0;
      list.forEach(function(p){
        var gv=0, rv=0, has=false;
        S.ptx.forEach(function(x){
          if(x.partyId!==p.id) return;
          if(sel.from && x.date < sel.from) return;
          if(sel.to && x.date > sel.to) return;
          has=true;
          if(x.kind==="credit") gv+=x.amount; else rv+=x.amount;
        });
        if(!has) return; /* no entry inside the period: no row for this patient */
        gv=Math.round(gv*100)/100; rv=Math.round(rv*100)/100;
        var b=partyBalance(p.id);
        rows.push({ p:p, given:gv, received:rv, balance:b });
        totGiven+=gv; totReceived+=rv; totBalance+=b;
      });
      return { g:g, rows:rows, count:rows.length, totalGiven:Math.round(totGiven*100)/100, totalReceived:Math.round(totReceived*100)/100, totalBalance:Math.round(totBalance*100)/100, from:sel.from, to:sel.to, period:doctorPeriodLabel(sel.from, sel.to), kind:doctorPeriodKind(sel.from, sel.to) };
    }
    function doctorReportPdf(key, sel){
      var d = doctorReportData(key, sel); if(!d) return null;
      var name = d.g.name || tl("en","noDoctor");
      var meta = [tl("en","doctorName")+": "+name, tl("en","period")+": "+d.period, tl("en","repDate")+": "+dstr(todayStr())];
      /* v6.49: the doctor's specialty under the name in the PDF too. */
      var dspec = doctorSpecForName(name);
      if(dspec) meta.splice(1, 0, tl("en","doctorSpec")+": "+dspec);
      var ctx = pdfDoc((S.settings.shop||tl("en","appName"))+" - "+tl("en","doctorPdfTitle"), meta);
      if(!ctx) return null;
      var doc = ctx.doc, y = ctx.y;
      /* Green rule under the meta block (the button is green too) — the
         one flourish that makes this report look finished, not plain. */
      doc.setDrawColor(22, 163, 74); doc.setLineWidth(0.8); doc.line(14, y, 196, y); doc.setLineWidth(0.2); y += 6;
      var cols = [{x:14,w:52},{x:68,w:14},{x:84,w:26},{x:112,w:26,align:"right"},{x:140,w:26,align:"right"},{x:168,w:28,align:"right"}];
      var head = [tl("en","patientName"), tl("en","serialNo"), tl("en","visitId"), tl("en","repGiven"), tl("en","repReceived"), tl("en","balance")];
      var rows = d.rows.map(function(r){
        var p = r.p;
        var nm = (p.patientName||"").trim()||(p.name||"").trim();
        var bal = fmt(Math.abs(r.balance)) + (r.balance===0 ? " ("+tl("en","settled")+")" : (r.balance>0 ? " ("+tl("en","willGet")+")" : " ("+tl("en","willGive")+")"));
        return [nm, p.serialNo||"-", p.visitId||"-", r.given?fmt(r.given):"-", r.received?fmt(r.received):"-", bal];
      });
      if(!rows.length) rows = [[tl("en","repNoEntries"), "", "", "", "", ""]];
      y = pdfTable(doc, head, rows, cols, y);
      y += 4;
      doc.setFont("helvetica","bold"); doc.setFontSize(11);
      [ tl("en","patients")+": "+d.count,
        tl("en","totalSale")+": "+fmt(d.totalGiven),
        tl("en","repTotalReceived")+": "+fmt(d.totalReceived),
        tl("en","balance")+": "+fmt(Math.abs(d.totalBalance))+(d.totalBalance===0?" ("+tl("en","settled")+")":(d.totalBalance>0?" ("+tl("en","willGet")+")":" ("+tl("en","willGive")+")"))
      ].forEach(function(l){ if(y>278){ doc.addPage(); y=16; } doc.text(l, 14, y); y += 7; });
      return { blob: doc.output("blob"), filename: "doctor-"+pdfFileName(name)+"-"+d.kind+"-"+todayStr()+".pdf" };
    }
    function doctorReportText(key, sel, lg){
      var d = doctorReportData(key, sel); if(!d) return "";
      lg = lg || L();
      var name = d.g.name || tl(lg,"noDoctor");
      var lines = [];
      lines.push(S.settings.shop || tl(lg,"appName"));
      lines.push(tl(lg,"doctorPdfTitle"));
      lines.push(tl(lg,"doctorName")+": "+name);
      lines.push(tl(lg,"period")+": "+d.period);
      lines.push(tl(lg,"repDate")+": "+dstr(todayStr()));
      lines.push("----------------------------------------");
      if(!d.rows.length) lines.push(tl(lg,"repNoEntries"));
      d.rows.forEach(function(r){
        var p = r.p;
        var nm = (p.patientName||"").trim()||(p.name||"").trim();
        lines.push(nm+" | "+tl(lg,"serialNo")+": "+(p.serialNo||"-")+" | "+tl(lg,"visitId")+": "+(p.visitId||"-")+" | "+tl(lg,"repGiven")+": "+fmt(r.given)+" | "+tl(lg,"repReceived")+": "+fmt(r.received)+" | "+tl(lg,"balance")+": "+fmt(Math.abs(r.balance)));
      });
      lines.push("----------------------------------------");
      lines.push(tl(lg,"patients")+": "+d.count);
      lines.push(tl(lg,"totalSale")+": "+fmt(d.totalGiven));
      lines.push(tl(lg,"repTotalReceived")+": "+fmt(d.totalReceived));
      lines.push(tl(lg,"balance")+": "+fmt(Math.abs(d.totalBalance)));
      return lines.join("\n");
    }
    function shareDoctorPdf(encKey){
      if(sharedMode && !canSee("printPdf")){ toast(t("shareNotAllowed")); return; }
      var sel = doctorPdfSel();
      if(!sel){ toast(t("noEntriesSel")); return; }
