    /* v6.24: Dashboard arrangement fix — auto-shrink a Dashboard amount
       until it fits its card on one line. The CSS (.dash .val nowrap)
       already stops the "Rs" / digits split; this handles long figures
       (e.g. millions) by stepping the font down from its base size
       (22px, or the inline 19px on the smaller cards) to a 10px floor.
       Runs after every Dashboard render, so a changed amount re-fits.
       Layout only — values, order, colours and behaviour unchanged.
       v6.26: this shrink NEVER ran on a real phone — .stat is a column
       flex with align-items:center, so each .val sized to its own text
       and scrollWidth was never > clientWidth. The v6.26 CSS caps .val
       at max-width:100% of its card, so the comparison below finally
       measures a real overflow and the shrink works. Floor lowered
       12px→10px: Farman's phone renders amounts ~11% wider than the
       bundled font (fallback font), so the longest figures need the
       extra headroom to fit a ~93px card on a 360px phone. */
    function fitDashAmounts(){
      var vals = document.querySelectorAll("#app .dash .val");
      for(var i=0;i<vals.length;i++){
        var el = vals[i];
        var base = 22;
        try{
          var inl = el.style && el.style.fontSize ? parseFloat(el.style.fontSize) : NaN;
          if(!isNaN(inl) && inl>0) base = inl;
        }catch(e){}
        el.style.fontSize = base + "px";
        /* No layout engine (jsdom / hidden view): clientWidth is 0, so
           there is nothing to measure — leave the base size. */
        var size = base, guard = 0;
        try{
          while(el.clientWidth > 0 && el.scrollWidth > el.clientWidth && size > 10 && guard < 20){
            size -= 1; guard++;
            el.style.fontSize = size + "px";
          }
        }catch(e){}
      }
    }
    /* v6.45: the amount must ALWAYS fit fully — never cut off or hidden
       at the sides (Farman 2026-11-17 21:39 PKT). The shrink above runs
       after every Dashboard render, but two real-phone cases can still
       leave a long amount ("Rs 116,824" and larger) clipped: (a) the
       fallback font loads AFTER the render and renders wider than the
       font measured at render time; (b) rotating the phone narrows the
       cards after the fit ran. So re-fit whenever the fonts settle and
       whenever the viewport size changes. Both are guarded (no-ops in
       jsdom / old WebViews) and only re-run the same fit — values,
       order, colours and behaviour unchanged. Applies to ALL 5
       Dashboard cards: the selector covers both rows (both containers
       carry class "dash"). The 10px floor covers any realistic figure:
       even a 7-digit amount fits a ~93px card at 10px with room left. */
    try{
      if(document.fonts && document.fonts.ready && document.fonts.ready.then){
        document.fonts.ready.then(function(){ try{ fitDashAmounts(); }catch(e){} });
      }
    }catch(e){}
    try{
      var __fitT = null;
      window.addEventListener("resize", function(){
        if(__fitT) clearTimeout(__fitT);
        __fitT = setTimeout(function(){ try{ if(view && view.name==="home") fitDashAmounts(); }catch(e){} }, 120);
      });
    }catch(e){}

    function dupPartyName(p){
      var nm = String(p.patientName||"").trim() || String(p.name||"").trim();

    }
    function dupPartyWhere(p){

         the Cash Book lists too), so name them as such — otherwise the
         message would point Farman at a list the holder is not in. */
      if(p.type==="supplier") return t("supplier");
      var k = isKhataParty(p), c = isCashParty(p);
      if(k && c) return t("khataCash");
      if(c) return t("cashbook");
      if(k) return t("khata");
      return "";

      var m = t("srDupNamed").replace("{serial}", srn).replace("{name}", dupPartyName(r));

       duplicate error can only fire when findSerialHolder() actually

       that holder (holderId). Normalization is String()-safe: a stored
       NUMERIC serialNo (legacy data) used to make .trim() throw and

       they can never block a serial — and repairDupSerials() below

    function partyInScope(p, scope){
      if(!p || !scope) return true;
      if(p.type === "supplier") return true;
      return scope === "khata" ? isKhataParty(p) : isCashParty(p);
    }
    function findSerialHolder(srn, selfId, scope){
      for(var j=0;j<S.parties.length;j++){ var r=S.parties[j]; if(r.id!==selfId && normSerial(r.serialNo)===srn && partyInScope(r, scope)) return r; }
      return null;
    }
    function repairDupSerials(){
      if(sharedMode) return 0;
      var fixed = 0, seen = {};
      S.parties.forEach(function(p){
        if(typeof p.serialNo !== "string") p.serialNo = normSerial(p.serialNo);
        else if(p.serialNo !== p.serialNo.trim()) p.serialNo = p.serialNo.trim();
      });
      S.parties.forEach(function(p){
        var s = normSerial(p.serialNo);
        if(!s) return;
        /* v6.42: a serial is a duplicate ONLY inside the same scope —
           a Khata 82 and a Cash Book 82 coexist, so holders are
           tracked per (serial, scope) pair; suppliers count in both. */
        var scopes = [];
        if(p.type === "supplier") scopes = ["khata", "cash"];
        else { if(isKhataParty(p)) scopes.push("khata"); if(isCashParty(p)) scopes.push("cash"); if(!scopes.length) scopes.push("khata"); }
        var dup = scopes.some(function(sc){ return seen[s+"|"+sc]; });
        if(dup){ p.serialNo = nextSerialForParty(p); fixed++; }
        else scopes.forEach(function(sc){ seen[s+"|"+sc] = 1; });
      });
      return fixed;
    }
    function partyIdError(sr, selfId, visit, scope){
      var srn = normSerial(sr);
      if(!srn) return {field:"pf_sr", msg:t("srRequired")};
      var holder = findSerialHolder(srn, selfId, scope);
      if(holder) return {field:"pf_sr", msg:srDupMsg(holder, srn), holderId:holder.id};
      /* v6.49: SEQUENTIAL SERIALS (Farman 2026-11-19) — within the Khata
         scope serials must be 1,2,3… with no gaps, so a NEW serial must
         be the lowest missing number. An edit may keep its OWN serial
         (unchanged, even a legacy non-numeric one) or fill the lowest
         missing one — anything else is rejected and the message NAMES
         the serial that must come first. Other scopes (and no scope)
         keep the old behaviour: required + unique only. */
      if(scope === "khata"){
        var curP = selfId ? partyById(selfId) : null;
        var cur = curP ? normSerial(curP.serialNo) : "";
        var curN = parseFloat(cur), newN = parseFloat(srn);
        var unchanged = (srn === cur) || (!isNaN(curN) && !isNaN(newN) && curN === newN);
        if(!unchanged){
          var need = nextSerialNo("khata");
          if(isNaN(newN) || newN <= 0 || Math.floor(newN) !== newN || String(newN) !== need){
            return {field:"pf_sr", msg:t("srSeq").replace("{serial}", srn).replace(/\{need\}/g, need)};
          }
        }
      }
      /* v6.29: a Visit ID may belong to only ONE party — a duplicate
         (another party, trimmed, case-insensitive) blocks the save,
         exactly like the Serial No. duplicate above. An empty Visit ID
         is never a duplicate: several parties may have none. */
      var v = (visit||"").trim();
      /* v6.55: Visit ID must be EXACTLY 8 digits when entered (Farman
         2026-11-24: "Visit id 8 hindso sy kam ya zyada na ho"). Empty
         stays allowed — the field is optional. Digits only, no fewer,
         no more; blocks typos, not real data (his Visit IDs are 8-digit). */
      if(v && !/^\d{8}$/.test(v)) return {field:"pf_visit", msg:t("visitId8")};
      if(v){
        var vl = v.toLowerCase();
        for(var k=0;k<S.parties.length;k++){ var q=S.parties[k]; if(q.id!==selfId && (q.visitId||"").trim().toLowerCase()===vl) return {field:"pf_visit", msg:t("visitDup")}; }
      }
      return null;
    }
    /* v6.40: the duplicate-serial error is ACTIONABLE — a button beside
       it opens the party that holds the serial, so it can be seen and
       fixed (its serial changed or the party deleted). Works for Khata
       parties and suppliers — and in shared
       mode too, when the grant allows editing and the party is visible
       to the viewer. When editing is not allowed in this shared view,
       the error says so plainly instead of offering a dead button. */
    function showPartyFormErr(err){
      var e = document.getElementById("pf_err");
      var holder = err.holderId ? partyById(err.holderId) : null;
      var canOpen = !!err.holderId && (!sharedMode || (canEdit() && canSeeParty(err.holderId)));
      if(e){
        e.style.display = "block";
        e.innerHTML = "";
        var sp = document.createElement("span"); sp.textContent = err.msg; e.appendChild(sp);
        if(canOpen){
          var b = document.createElement("button");
          b.className = "btn sm ghost"; b.style.marginLeft = "8px"; b.type = "button";
          b.textContent = t("openParty");
          b.onclick = function(){ openSerialHolder(err.holderId); };
          e.appendChild(b);
        } else if(err.holderId && sharedMode){
          var nt = document.createElement("div");
          nt.style.marginTop = "6px"; nt.style.fontSize = "13px";
          nt.textContent = t("srDupSharedNoEdit");
          e.appendChild(nt);
        }
      }
      toast(err.msg);
    }
    function openSerialHolder(pid){
      var p = partyById(pid); if(!p) return;
      /* Shared mode: only open what this viewer may edit and see. */
      if(sharedMode && (!canEdit() || !canSeeParty(pid))){ toast(t("srDupSharedNoEdit")); return; }
      closeSheet();
      partyForm(pid);
    }
    function partySave(id){
      if(sharedMode && !canEdit()){ toast(t("shareNotAllowed")); return; }
      var p0 = id ? partyById(id) : null;
      if(id && !p0){ toast(t("errUnknown")); return; }
      /* v6.7: the Name field is gone from the form — a new party saves with
         an empty name (the name key stays, as ""), an edited party keeps
         the name it already had (older parties). The Serial No. is the
         identifier now. */
      var name = p0 ? (p0.name||"") : "";
      /* v6.11: no phone field in the form any more — the stored phone
         value is never overwritten here.
         v6.21: no old party-ID field either — nothing reads or writes it
         here any more. An old party keeps its stored value untouched
         (never assigned, never deleted); a new party gets no such key. */
      var sr = document.getElementById("pf_sr").value.trim();
      /* v6.19: patient fields — optional, never block the save.
         v6.28: Ward Name added, same optional pattern.
         v6.50: Ward Name is gone from the form — nothing reads pf_ward
         any more; a stored wardName is never cleared here. */
      var patient = document.getElementById("pf_patient").value.trim();
      var father = document.getElementById("pf_father").value.trim();
      var visit = document.getElementById("pf_visit").value.trim();
      var doctor = document.getElementById("pf_doctor").value.trim();
      /* v6.49: a doctor that is not in the managed list never saves. */
      var derr = doctorError(doctor, id||"");
      if(derr){
        showPartyFormErr(derr);
        var df = document.getElementById(derr.field); if(df) df.focus();
        return;
      }
      /* v6.49: the specialty comes from the managed list (auto-filled);
         a legacy doctor keeps the specialty it already had stored. */
      var specEl = document.getElementById("pf_spec");
      var spec = doctorSpecForName(doctor) || (specEl ? specEl.value.trim() : "");
      /* v6.40: repair legacy duplicate serials before validating, so a
         duplicate hiding in the data repairs instead of blocking. */
      if(repairDupSerials()){ save(); toast(t("dupSerialFixed")); }
      var err = partyIdError(sr, id||"", visit, "khata");
      if(err){
        showPartyFormErr(err);
        var f = document.getElementById(err.field); if(f) f.focus();
        return;
      }
      if(id){
        var p = partyById(id); p.name = name; p.serialNo = sr;
        p.patientName = patient; p.fatherName = father; p.visitId = visit; p.doctorName = doctor; p.doctorSpec = spec;
        /* v6.31: this form never touches p.photo any more (photo removed
           from Khata) — a photo saved from the Cash Book sheet stays
           exactly as it was. */
      } else {
        var np = { id:uid(), name:name, serialNo:sr, patientName:patient, fatherName:father, visitId:visit, doctorName:doctor, doctorSpec:spec, type:"customer", createdAt:todayStr(), createdIn:"khata" };
        S.parties.push(np);
        var open = evalAmount(document.getElementById("pf_open").value)||0;
        if(open>0) S.ptx.push({ id:uid(), partyId:np.id, kind:"credit", amount:open, note:t("openingNote"), date:todayStr() });
        id = np.id;
      }
      save(); closeSheet(); toast(t("saved")); go("party", id);
    }
    /* v6.23 separation: deleting a party from Khata deletes ONLY its
       Khata entries. The cash mirrors of its payments (ptxId-linked)
       STAY — they are real cash in hand, so Cash in Hand must not
       change. If the party has no Cash Book entries at all it is
       deleted; otherwise the record stays in Cash Book only
       (createdIn = "cash"). hasCashEntries is read BEFORE the ptx
       entries are removed, so mirrors still resolve to the party. */
    function partyDelete(id){
      if(sharedMode && !canDelete()){ toast(t("shareNotAllowed")); return; }
      var p = partyById(id); if(!p) return;
      var txs = S.ptx.filter(function(x){ return x.partyId===id; });
      var hasCash = hasCashEntries(id);
      var msg = txs.length
        ? t("deletePartyMsg").replace("{name}", partyLabel(p)).replace("{n}", String(txs.length))
        : t("deletePartyMsg0").replace("{name}", partyLabel(p));
      confirmSheet(msg, t("delete"), function(){
        /* v6.35: to Trash, not gone — the party snapshot (deep copy: the
           live record may stay as cash-only) + its removed ledger entries. */
        trashAdd({ id:uid(), kind:"party", label:(p.patientName || partyLabel(p)), deletedAt:Date.now(), deletedDate:todayStr(), party:trashClone(p), ptx:S.ptx.filter(function(x){ return x.partyId===id; }).map(trashClone), ctx:[] });
        S.ptx = S.ptx.filter(function(x){ return x.partyId!==id; });
        if(hasCash){ p.createdIn = "cash"; }
        else { S.parties = S.parties.filter(function(q){ return q.id!==id; }); }
        save(); toast(t("deleted")); go("khata");
      });
    }

    /* Print / PDF (party ledger): window.print() does nothing inside a
       WebView — the Android wrapper's SafiKhataBridge.printPage() opens
       the system print sheet (Save as PDF) with the WebView's own print
       adapter, so the @media print rules above are honoured. In a plain
       browser fall back to window.print(). */
    function printLedger(){
      if(sharedMode && !canSee("printPdf")){ toast(t("shareNotAllowed")); return; }
      try{
        var b = window.SafiKhataBridge;
        if(b && typeof b.printPage==="function"){ b.printPage(); return; }
      }catch(e){}
      window.print();
    }

    /* ---------- v6.15: PDF REPORTS ----------
       Per-customer ledger PDF + total (all customers) PDF, both shareable.
       PDF files are built with jsPDF (CDN, same pattern as the Firebase
       SDK scripts). jsPDF's built-in fonts are Latin-only and it does no
       Arabic shaping, so the PDF itself always uses ENGLISH labels with
       Rs amounts and DD-MM-YYYY dates; the TEXT share fallback uses the
       current UI language and renders Urdu correctly. If the CDN is
       unreachable (offline) window.jspdf is undefined — every call here
       is guarded, so the app never breaks: share falls back to text,
       then to a download. */
    function tl(lg,k){ return (STR[lg] && STR[lg][k]) || STR.en[k] || k; }
    function pdfFileName(s){ return String(s||"").replace(/[^a-zA-Z0-9._-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"") || "report"; }
    function reportEntryLabel(p, x, lg){
      if(x.billId) return tl(lg,"billFrom")+" #"+(billById(x.billId)?billById(x.billId).no:"");
      if(x.kind==="credit") return p.type==="customer"?tl(lg,"gaveCredit"):tl(lg,"tookCredit");
      return p.type==="customer"?tl(lg,"gotPayment"):tl(lg,"gavePayment");
    }
    function customerReportData(pid){
      var p = partyById(pid); if(!p) return null;
      var isCust = p.type==="customer";
      /* v6.38: txs in INSERTION order (= creation order). The running
         balance below is computed on a DATE-ascending copy, so each
         row's balance stays the balance after that entry by date. */
      var txs = S.ptx.filter(function(x){ return x.partyId===pid; });
      var asc = txs.slice().sort(function(a,c){ return (a.date+a.id).localeCompare(c.date+c.id); });
      var run = 0, totGiven = 0, totReceived = 0;
      var entries = asc.map(function(x){
        var given = 0, received = 0;
        if(isCust){ if(x.kind==="credit") given = x.amount; else received = x.amount; }
        else { if(x.kind==="pay") given = x.amount; else received = x.amount; }
        if(x.kind==="credit") run += x.amount; else run -= x.amount;
        run = Math.round(run*100)/100;
        totGiven += given; totReceived += received;
        return { date:x.date, detail:x, given:given, received:received, balance:run };
      });
      var b = partyBalance(pid);
      var positive = (p.type==="customer" && b>0) || (p.type==="supplier" && b<0);
      /* v6.38: entries display in reverse CREATION order (Farman: latest
         entry on top, whatever its date — v6.37 reversed the
         date-sorted array, so a back-dated entry added last still came
         out below newer-dated ones). The running balance above was
         computed chronologically (oldest → newest by date), so ONLY the
         display order changes here. Totals unchanged. */
      var pos = {}; txs.forEach(function(x,i){ pos[x.id] = i; });
      entries.sort(function(a,b){ return pos[b.detail.id] - pos[a.detail.id]; });
      return { p:p, entries:entries, totalGiven:Math.round(totGiven*100)/100, totalReceived:Math.round(totReceived*100)/100, balance:b, positive:positive };
    }
    /* v6.19: patient fields — four OPTIONAL text fields on the party
       record (Patient Name, Father Name, Visit ID, Doctor Name). Older
       parties have none of these keys; they read as empty and are
       skipped everywhere, so old data keeps working unchanged. */
    function patientMetaLines(p, lg){
      lg = lg || "en";
      var lines = [];
      if(p.patientName) lines.push(tl(lg,"patientName")+": "+p.patientName);
      if(p.fatherName) lines.push(tl(lg,"fatherName")+": "+p.fatherName);
      /* v6.21: Visit ID is NO LONGER in this patient block — it moved to
         the ID position (list row, detail head, report meta) where it
         replaces the old party ID, so it is shown exactly once. */
      if(p.doctorName) lines.push(tl(lg,"doctorName")+": "+p.doctorName);
      /* v6.49: the specialty travels with the doctor name (managed list
         first, else the specialty stored on the party). */
      var pspec = p.doctorSpec || doctorSpecForName(p.doctorName||"");
      if(p.doctorName && pspec) lines.push(tl(lg,"doctorSpec")+": "+pspec);
      if(p.wardName) lines.push(tl(lg,"wardName")+": "+p.wardName);
      return lines;
    }
    function customerReportText(pid, lg){
      var d = customerReportData(pid); if(!d) return "";
      lg = lg || L();
      var p = d.p;
      var lines = [];
      lines.push(S.settings.shop || tl(lg,"appName"));
      lines.push(tl(lg,"repTitle"));
      lines.push(tl(lg,"repDate")+": "+dstr(todayStr()));
      lines.push(tl(lg,"customer")+": "+partyLabel(p));
      if(p.phone) lines.push(tl(lg,"phone")+": "+p.phone);
      if(p.visitId) lines.push(tl(lg,"visitId")+": "+p.visitId);
      if(p.serialNo) lines.push(tl(lg,"serialNo")+": "+p.serialNo);
      patientMetaLines(p, lg).forEach(function(l){ lines.push(l); });
      lines.push("----------------------------------------");
      lines.push(tl(lg,"repDate")+" | "+tl(lg,"repDetail")+" | "+tl(lg,"repGiven")+" | "+tl(lg,"repReceived")+" | "+tl(lg,"balance"));
      if(!d.entries.length) lines.push(tl(lg,"repNoEntries"));
      d.entries.forEach(function(e){
        lines.push(dstr(e.date)+" | "+reportEntryLabel(p, e.detail, lg)+(e.detail.note?" - "+e.detail.note:"")+" | "+(e.given?fmt(e.given):"-")+" | "+(e.received?fmt(e.received):"-")+" | "+fmt(e.balance));
      });
      lines.push("----------------------------------------");
      lines.push(tl(lg,"repTotalGiven")+": "+fmt(d.totalGiven));
      lines.push(tl(lg,"repTotalReceived")+": "+fmt(d.totalReceived));
      lines.push(tl(lg,"balance")+": "+fmt(Math.abs(d.balance))+(d.balance===0?" ("+tl(lg,"settled")+")":(d.positive?" ("+tl(lg,"willGet")+")":" ("+tl(lg,"willGive")+")")));
      return lines.join("\n");
    }
    function totalReportData(){
      var rows = S.parties.filter(function(p){ return p.type==="customer" && isKhataParty(p); }).map(function(p){
        return { p:p, balance:partyBalance(p.id) };
      }).sort(function(a,b){ return b.balance-a.balance; });
      var get=0, give=0;
      rows.forEach(function(r){ if(r.balance>0) get+=r.balance; else if(r.balance<0) give+=-r.balance; });
      return { rows:rows, count:rows.length, get:Math.round(get*100)/100, give:Math.round(give*100)/100 };
    }
    function totalReportText(lg){
      lg = lg || L();
      var d = totalReportData();
      var lines = [];
      lines.push(S.settings.shop || tl(lg,"appName"));
      lines.push(tl(lg,"repTotalTitle"));
      lines.push(tl(lg,"repDate")+": "+dstr(todayStr()));
      lines.push("----------------------------------------");
      if(!d.rows.length) lines.push(tl(lg,"repNoEntries"));
      d.rows.forEach(function(r){
        var lbl = r.balance===0 ? tl(lg,"settled") : (r.balance>0 ? tl(lg,"willGet") : tl(lg,"willGive"));
        lines.push(partyLabel(r.p)+" | "+(r.p.phone||"-")+" | "+fmt(Math.abs(r.balance))+" ("+lbl+")");
      });
      lines.push("----------------------------------------");
      lines.push(tl(lg,"customers")+": "+d.count);
      lines.push(tl(lg,"youllGet")+": "+fmt(d.get));
      lines.push(tl(lg,"youllGive")+": "+fmt(d.give));
      return lines.join("\n");
    }
    /* jsPDF helpers: one small table renderer used by both PDFs. */
    function pdfCell(doc, text, col, y){
      var lines = doc.splitTextToSize(String(text==null?"":text), col.w);
      var x = col.align==="right" ? col.x+col.w : col.x;
      doc.text(lines, x, y, { align: col.align || "left" });
      return lines.length;
    }
    function pdfTable(doc, head, rows, cols, y){
      function drawHead(yy){
        doc.setFont("helvetica","bold"); doc.setFontSize(10);
        head.forEach(function(h,i){ pdfCell(doc, h, cols[i], yy); });
        doc.setDrawColor(160); doc.line(14, yy+2, 196, yy+2);
        return yy+8;
      }
      y = drawHead(y);
      doc.setFont("helvetica","normal"); doc.setFontSize(10);
      rows.forEach(function(r){
        var n = 1;
        r.forEach(function(c,i){ n = Math.max(n, doc.splitTextToSize(String(c==null?"":c), cols[i].w).length); });
        if(y + n*5 > 278){ doc.addPage(); y = drawHead(16); doc.setFont("helvetica","normal"); doc.setFontSize(10); }
        r.forEach(function(c,i){ pdfCell(doc, c, cols[i], y); });
        y += n*5 + 2;
      });
      return y;
    }
    function pdfDoc(title, metaLines){
      var JSPDF = window.jspdf && window.jspdf.jsPDF;
      if(typeof JSPDF !== "function") return null;
      var doc = new JSPDF({ unit:"mm", format:"a4" });
      var y = 16;
      doc.setFont("helvetica","bold"); doc.setFontSize(15);
      doc.text(title, 14, y); y += 8;
      doc.setFont("helvetica","normal"); doc.setFontSize(11);
      metaLines.forEach(function(l){
        doc.text(doc.splitTextToSize(l, 182), 14, y); y += 6;
      });
      return { doc:doc, y:y+4 };
    }
    function customerReportPdf(pid){
      var d = customerReportData(pid); if(!d) return null;
      var p = d.p;
      var meta = [tl("en","repDate")+": "+dstr(todayStr()), tl("en","customer")+": "+partyLabel(p)];
      if(p.phone) meta.push(tl("en","phone")+": "+p.phone);
      if(p.visitId) meta.push(tl("en","visitId")+": "+p.visitId);
      if(p.serialNo) meta.push(tl("en","serialNo")+": "+p.serialNo);
      patientMetaLines(p, "en").forEach(function(l){ meta.push(l); });
      var ctx = pdfDoc((S.settings.shop||tl("en","appName"))+" - "+tl("en","repTitle"), meta);
      if(!ctx) return null;
      var doc = ctx.doc, y = ctx.y;
      var cols = [{x:14,w:24},{x:40,w:72},{x:114,w:26,align:"right"},{x:142,w:26,align:"right"},{x:170,w:26,align:"right"}];
      var head = [tl("en","repDate"), tl("en","repDetail"), tl("en","repGiven"), tl("en","repReceived"), tl("en","balance")];
      var rows = d.entries.map(function(e){
        return [dstr(e.date), reportEntryLabel(p, e.detail, "en")+(e.detail.note?" - "+e.detail.note:""), e.given?fmt(e.given):"-", e.received?fmt(e.received):"-", fmt(e.balance)];
      });
      if(!rows.length) rows = [[tl("en","repNoEntries"), "", "", "", ""]];
      y = pdfTable(doc, head, rows, cols, y);
      y += 4;
      doc.setFont("helvetica","bold"); doc.setFontSize(11);
      var totLines = [
        tl("en","repTotalGiven")+": "+fmt(d.totalGiven),
        tl("en","repTotalReceived")+": "+fmt(d.totalReceived),
        tl("en","balance")+": "+fmt(Math.abs(d.balance))+(d.balance===0?" ("+tl("en","settled")+")":(d.positive?" ("+tl("en","willGet")+")":" ("+tl("en","willGive")+")"))
      ];
      totLines.forEach(function(l){ if(y>278){ doc.addPage(); y=16; } doc.text(l, 14, y); y += 7; });
      return { blob: doc.output("blob"), filename: "khata-"+pdfFileName(partyLabel(p))+"-"+todayStr()+".pdf" };
    }
    function totalReportPdf(){
      var d = totalReportData();
      var ctx = pdfDoc((S.settings.shop||tl("en","appName"))+" - "+tl("en","repTotalTitle"), [tl("en","repDate")+": "+dstr(todayStr())]);
      if(!ctx) return null;
      var doc = ctx.doc, y = ctx.y;
      var cols = [{x:14,w:62},{x:78,w:40},{x:120,w:76,align:"right"}];
      var head = [tl("en","customer"), tl("en","phone"), tl("en","balance")];
      var rows = d.rows.map(function(r){
        var lbl = r.balance===0 ? tl("en","settled") : (r.balance>0 ? tl("en","willGet") : tl("en","willGive"));
        return [partyLabel(r.p), r.p.phone||"-", fmt(Math.abs(r.balance))+" ("+lbl+")"];
      });
      if(!rows.length) rows = [[tl("en","repNoEntries"), "", ""]];
      y = pdfTable(doc, head, rows, cols, y);
      y += 4;
      doc.setFont("helvetica","bold"); doc.setFontSize(11);
      [ tl("en","customers")+": "+d.count, tl("en","youllGet")+": "+fmt(d.get), tl("en","youllGive")+": "+fmt(d.give) ].forEach(function(l){ if(y>278){ doc.addPage(); y=16; } doc.text(l, 14, y); y += 7; });
      return { blob: doc.output("blob"), filename: "safi-khata-total-report-"+todayStr()+".pdf" };
    }
    /* Share a generated PDF file; fall back to sharing the same report
       as text, then to downloading the PDF. Never throws.
       v6.20 — inside the Android app the native bridge owns PDF saving
       and runs FIRST: the old saveFile path only toasted "Saved to
       Downloads" without verifying the write, and on some phones the
       PDF never appeared in Files/Downloads at all. The bridge writes
       the file to the public Downloads folder (verified) and opens the
       share sheet, so the user never has to hunt for the file. The
       Web Share attempts below are for plain browsers only. */
    function shareReportPdf(blob, filename, text){
      if(blob && window.SafiKhataBridge && typeof window.SafiKhataBridge.saveAndSharePdf === "function"){
        try{ downloadPdfBlob(blob, filename); }catch(e){ toast(t("pdfSaveFailed")); }
        return;
      }
      try{
        if(blob && typeof File === "function"){
          var file = new File([blob], filename, { type:"application/pdf" });
          if(navigator.canShare && navigator.canShare({ files:[file] })){
            navigator.share({ files:[file] }).catch(function(){});
            return;
          }
        }
      }catch(e){}
      try{
        if(navigator.share){ navigator.share({ text:text }).catch(function(){}); return; }

    /* v6.17 paid-up rule, KEPT in v6.19: a party is paid-up when it has
       at least one entry AND its balance is exactly Rs 0. Both PDF
       selectors (Khata + Cash Book) use it for their Status filter. */
    function paidUpParties(){
      return khataTabList().filter(function(p){
        if(partyBalance(p.id)!==0) return false;
        return S.ptx.some(function(x){ return x.partyId===p.id; });
      });
    }
    /* ---------- v6.19: KHATA PDF SELECTOR ----------
       The v6.17 single paid-up PDF button is replaced: tapping the PDF
       button below the Khata totals strip now opens a selector sheet
       modelled on the v6.18 Cash Book PDF selector — Party (multi-select
       checkboxes: one party, several parties, or all, default All) and
       Status (All / Paid-up only — paid-up uses the v6.17 Khata rule:
       at least one entry AND balance exactly Rs 0). The PDF lists the
       matching parties, one section per party with the same per-party
       record content as the per-party PDF (full entries, given/received
       totals, balance, plus the v6.19 patient fields), then grand
       totals. English labels in the PDF like all other PDFs; the
       text-share fallback uses the current language. No matching party
       → toast, no PDF is generated. paidUpParties() is kept: the Cash
       Book PDF selector still uses it for its own Status filter. */
    function khataPdfParties(){
      /* v6.23: only Khata parties (same list as the Khata tab). */
      return khataTabList().map(function(p){ return p.id; });
    }
    function khAllToggle(el){
      var boxes = document.querySelectorAll(".kh_party");
      for(var i=0;i<boxes.length;i++) boxes[i].checked = !!el.checked;
    }
    function khPartyToggle(){
      var boxes = document.querySelectorAll(".kh_party");
      var all = document.getElementById("kh_all");
      if(!all) return;
      var every = true;
      for(var i=0;i<boxes.length;i++) if(!boxes[i].checked){ every = false; break; }
      all.checked = every && boxes.length>0;
    }
    /* v6.54: Khata PDF "Type" filter (Farman 2026-11-24) — a separate
       PDF for the Will Pay side, and every checklist row shows its
       amount + will get / will pay label, coloured exactly like the
       Khata list rows. The checklist re-renders when the Type changes,
       keeping the checked state of parties that stay visible; a party
       hidden by the filter is unchecked. */
    function khataPdfDir(p){
      var b = partyBalance(p.id);
      if(b===0) return "settled";
      return ((p.type==="customer" && b>0) || (p.type==="supplier" && b<0)) ? "get" : "pay";
    }
    function khataPdfRowHtml(pp, checked){
      var b = partyBalance(pp.id);
      var dir = khataPdfDir(pp);
      var col = dir==="get" ? "var(--good)" : (dir==="pay" ? "var(--danger)" : "var(--muted)");
      var lbl = dir==="get" ? t("willGet") : (dir==="pay" ? t("willPay") : t("settled"));
      return '<label class="cbprow"><input type="checkbox" class="kh_party" value="'+pp.id+'"'+(checked?" checked":"")+' onchange="khPartyToggle()"> <span class="grow">'+esc(partyLabel(pp))+'</span><span class="amt num" style="color:'+col+'">'+fmt(Math.abs(b))+'<small>'+esc(lbl)+'</small></span></label>';
    }
    function khataPdfChecklistRows(kept){
      var type = "all";
      var sel = document.getElementById("kh_type");
      if(sel) type = sel.value || "all";
      var h = "";
      khataPdfParties().forEach(function(pid){
        var pp = partyById(pid); if(!pp) return;
        if(type!=="all" && khataPdfDir(pp)!==type) return;
        h += khataPdfRowHtml(pp, !kept || kept[pid]);
      });
      return h;
    }
    function khataPdfTypeChange(){
      var ty = "all";
      var sel = document.getElementById("kh_type");
      if(sel) ty = sel.value || "all";
      var boxes = document.querySelectorAll(".kh_party");
      var kept = {};
      for(var i=0;i<boxes.length;i++){
        if(!boxes[i].checked) continue;
        if(ty==="all"){ kept[boxes[i].value]=1; continue; }
        var pp = partyById(boxes[i].value);
        if(pp && khataPdfDir(pp)===ty) kept[boxes[i].value]=1;
      }
      var list = document.getElementById("kh_pdflist");
      if(!list) return;
      list.innerHTML = '<label class="cbprow"><input type="checkbox" id="kh_all" checked onchange="khAllToggle(this)"> '+esc(t("allParties"))+'</label>' + khataPdfChecklistRows(kept);
      khPartyToggle();
    }
    function openKhataPdfSheet(){
      if(sharedMode && !canSee("printPdf")){ toast(t("shareNotAllowed")); return; }
      var h = '<h2>'+esc(t("khPdfTitle"))+'</h2>'
        + '<div class="field"><label>'+esc(t("cashParty"))+'</label><div class="cbplist" id="kh_pdflist">'
        + '<label class="cbprow"><input type="checkbox" id="kh_all" checked onchange="khAllToggle(this)"> '+esc(t("allParties"))+'</label>'
        + khataPdfChecklistRows(null)
        + '</div></div>'
        + '<div class="frow"><div class="field"><label>'+esc(t("type"))+'</label><select id="kh_type" onchange="khataPdfTypeChange()"><option value="all">'+esc(t("typeAll"))+'</option><option value="get">'+esc(t("typeWillGet"))+'</option><option value="pay">'+esc(t("typeWillPay"))+'</option></select></div>'
        + '<div class="field"><label>'+esc(t("cbStatus"))+'</label><select id="kh_status"><option value="all">'+esc(t("cbStatusAll"))+'</option><option value="paidup">'+esc(t("paidUpOnly"))+'</option></select></div></div>'
        + '<div class="actions"><button class="btn ghost" onclick="closeSheet()">'+esc(t("cancel"))+'</button><button class="btn primary pdfbtn" onclick="shareKhataPdf()">'+esc(t("makePdf"))+'</button></div>';
      openSheet(h);
    }
    /* Read the selector sheet. Returns null when the sheet is not open.
       partyIds: null = all parties, otherwise the checked party ids.
       status: "all"|"paidup". type: "all"|"get"|"pay" (v6.54). */
    function khataPdfSel(){
      var all = document.getElementById("kh_all");
      if(!all) return null;
      var boxes = document.querySelectorAll(".kh_party");
      var ids = [];
      for(var i=0;i<boxes.length;i++) if(boxes[i].checked) ids.push(boxes[i].value);
      var st = document.getElementById("kh_status");
      var ty = document.getElementById("kh_type");
      return { partyIds: all.checked ? null : ids, status: st ? st.value : "all", type: ty ? ty.value : "all" };
    }
    function khataReportData(sel){
      sel = sel || { partyIds:null, status:"all", type:"all" };
      var paidUpIds = null;
      if(sel.status==="paidup"){
        paidUpIds = {};
        paidUpParties().forEach(function(p){ paidUpIds[p.id] = 1; });
      }
      var cands = khataPdfParties();
      if(sel.partyIds){
        cands = cands.filter(function(pid){ return sel.partyIds.indexOf(pid) > -1; });
      }
      if(paidUpIds){
        cands = cands.filter(function(pid){ return paidUpIds[pid]; });
      }
      /* v6.54: Type filter — Will Get only / Will Pay only. Direction
         follows the app's rule (khataPdfDir): customer b>0 or supplier
         b<0 is will get; customer b<0 or supplier b>0 is will pay;
         zero-balance parties belong to neither. Composes with the
         paid-up filter: paid-up + will-pay is empty, and the existing
         "No entries for this selection" toast already covers that. */
      var type = sel.type || "all";
      if(type==="get" || type==="pay"){
        cands = cands.filter(function(pid){
          var pp = partyById(pid); if(!pp) return false;
          return khataPdfDir(pp)===type;
        });
      }
      var sections = [];
      var get = 0, give = 0;
      cands.forEach(function(pid){
        var d = customerReportData(pid); if(!d) return;
        sections.push(d);
        if(d.balance>0) get += d.balance;
        else if(d.balance<0) give += -d.balance;
      });
      return { sections:sections, count:sections.length, get:Math.round(get*100)/100, give:Math.round(give*100)/100, sel:sel };
    }
    function khataSelLabel(sel, lg){
      lg = lg || L();
      if(!sel.partyIds) return tl(lg,"allParties");
      if(!sel.partyIds.length) return "-";
      return sel.partyIds.map(function(pid){ return partyById(pid) ? partyLabel(partyById(pid)) : pid; }).join(", ");
    }
    function khataReportText(sel, lg){
      var d = khataReportData(sel); lg = lg || L();
      var lines = [];
      lines.push(S.settings.shop || tl(lg,"appName"));
      lines.push(tl(lg,"repTitle"));
      lines.push(tl(lg,"repDate")+": "+dstr(todayStr()));
      lines.push(tl(lg,"cashParty")+": "+khataSelLabel(d.sel, lg));
      if(d.sel.status==="paidup") lines.push(tl(lg,"cbStatus")+": "+tl(lg,"paidUpOnly"));
      if(d.sel.type==="get") lines.push(tl(lg,"type")+": "+tl(lg,"typeWillGet"));
      if(d.sel.type==="pay") lines.push(tl(lg,"type")+": "+tl(lg,"typeWillPay"));
      d.sections.forEach(function(sec){
        lines.push("----------------------------------------");
        lines.push(customerReportText(sec.p.id, lg));
      });
      lines.push("----------------------------------------");
      lines.push(tl(lg,"customers")+": "+d.count);
      if(d.sel.type!=="pay") lines.push(tl(lg,"youllGet")+": "+fmt(d.get));
      if(d.sel.type!=="get") lines.push(tl(lg,"youllGive")+": "+fmt(d.give));
      return lines.join("\n");
    }
    function khataReportPdf(sel){
      var d = khataReportData(sel);
      var partyLbl = khataSelLabel(d.sel, "en");
      var meta = [tl("en","repDate")+": "+dstr(todayStr()), tl("en","cashParty")+": "+partyLbl];
      if(d.sel.status==="paidup") meta.push(tl("en","cbStatus")+": "+tl("en","paidUpOnly"));
      if(d.sel.type==="get") meta.push(tl("en","type")+": "+tl("en","typeWillGet"));
      if(d.sel.type==="pay") meta.push(tl("en","type")+": "+tl("en","typeWillPay"));
      var ctx = pdfDoc((S.settings.shop||tl("en","appName"))+" - "+tl("en","repTitle"), meta);
      if(!ctx) return null;
      var doc = ctx.doc, y = ctx.y;
      var cols = [{x:14,w:24},{x:40,w:72},{x:114,w:26,align:"right"},{x:142,w:26,align:"right"},{x:170,w:26,align:"right"}];
      var head = [tl("en","repDate"), tl("en","repDetail"), tl("en","repGiven"), tl("en","repReceived"), tl("en","balance")];
      d.sections.forEach(function(sec, idx){
        var p = sec.p;
        if(idx>0){ y += 6; }
        if(y>260){ doc.addPage(); y=16; }
        doc.setFont("helvetica","bold"); doc.setFontSize(12);
        doc.text(doc.splitTextToSize(partyLabel(p), 182), 14, y); y += 7;
        doc.setFont("helvetica","normal"); doc.setFontSize(10);
        var meta2 = [];
        if(p.phone) meta2.push(tl("en","phone")+": "+p.phone);
        if(p.visitId) meta2.push(tl("en","visitId")+": "+p.visitId);
        if(p.serialNo) meta2.push(tl("en","serialNo")+": "+p.serialNo);
        patientMetaLines(p, "en").forEach(function(l){ meta2.push(l); });
        meta2.forEach(function(l){ if(y>278){ doc.addPage(); y=16; } doc.text(l, 14, y); y += 6; });
        y += 2;
        var rows = sec.entries.map(function(e){
          return [dstr(e.date), reportEntryLabel(p, e.detail, "en")+(e.detail.note?" - "+e.detail.note:""), e.given?fmt(e.given):"-", e.received?fmt(e.received):"-", fmt(e.balance)];
        });
        if(!rows.length) rows = [[tl("en","repNoEntries"), "", "", "", ""]];
        y = pdfTable(doc, head, rows, cols, y);
        y += 4;
        doc.setFont("helvetica","bold"); doc.setFontSize(11);
        [ tl("en","repTotalGiven")+": "+fmt(sec.totalGiven),
          tl("en","repTotalReceived")+": "+fmt(sec.totalReceived),
          tl("en","balance")+": "+fmt(Math.abs(sec.balance))+(sec.balance===0?" ("+tl("en","settled")+")":(sec.positive?" ("+tl("en","willGet")+")":" ("+tl("en","willGive")+")"))
        ].forEach(function(l){ if(y>278){ doc.addPage(); y=16; } doc.text(l, 14, y); y += 7; });
      });
      y += 4;
      doc.setFont("helvetica","bold"); doc.setFontSize(12);
      /* v6.54: a filtered PDF shows only the matching grand total. */
      var totLines = [ tl("en","customers")+": "+d.count ];
      if(d.sel.type!=="pay") totLines.push(tl("en","youllGet")+": "+fmt(d.get));
      if(d.sel.type!=="get") totLines.push(tl("en","youllGive")+": "+fmt(d.give));
      totLines.forEach(function(l){ if(y>278){ doc.addPage(); y=16; } doc.text(l, 14, y); y += 7; });
      /* v6.54: filtered PDFs are named by type; the All case keeps the
         existing single-party / multiple / all naming. */
      var filename;
      if(d.sel.type==="get") filename = "safi-khata-khata-willget-"+todayStr()+".pdf";
      else if(d.sel.type==="pay") filename = "safi-khata-khata-willpay-"+todayStr()+".pdf";
      else {
        var partyPart = !d.sel.partyIds ? "all" : (d.sel.partyIds.length===1 ? pdfFileName(partyById(d.sel.partyIds[0]) ? partyLabel(partyById(d.sel.partyIds[0])) : "party") : "multiple");
        filename = "safi-khata-khata-"+partyPart+"-"+todayStr()+".pdf";
      }
      return { blob: doc.output("blob"), filename: filename };
    }
    function shareKhataPdf(){
      if(sharedMode && !canSee("printPdf")){ toast(t("shareNotAllowed")); return; }
      var sel = khataPdfSel();

      closeSheet();
      var d = khataReportData(sel);
      if(!d.sections.length){ toast(t("noEntriesSel")); return; }

        if(navigator.share){ navigator.share({ text:text }).catch(function(){}); return; }
      }catch(e){}
      toast(t("errNetwork"));
    }

    /* ---------- PARTY DETAIL ---------- */
    function renderParty(pid){
      var p = partyById(pid);
      /* Missing party: owner mode redirects to Khata as before; in shared
         mode render() already redirected centrally, so just return. */
      if(!p){ if(!sharedMode) go("khata"); return; }
      /* v6.23 separation: a Cash Book-only party has no Khata detail —
         redirect to the Khata list, same as a missing party. */
      if(!isKhataParty(p)){ if(!sharedMode) go("khata"); return; }
      /* v6.24: in shared mode a non-granted party's detail is blocked. */
      if(sharedMode && !canSeeParty(pid)){ toast(t("shareNotYourKhata")); go("khata"); return; }
      /* v6.7: in shared mode the detail screen opens only when the Party
         detail toggle is ON (render() redirects here centrally). */
      if(sharedMode && !canSee("partydetail")){ return; }
      var b = partyBalance(pid);
      /* v6.38: entries display in reverse CREATION order (Farman: the
         latest entry must come on top, whatever its date — v6.37's
         date-descending sort buried a back-dated entry below
         newer-dated ones). S.ptx filter preserves insertion order, so
         reverse it. No running balance per row here. */
      var txs = S.ptx.filter(function(x){ return x.partyId===pid; }).slice().reverse();
      var positive = (p.type==="customer" && b>0) || (p.type==="supplier" && b<0);
      var patLines = patientMetaLines(p, L()).map(function(l){ return esc(l); }).join(" · ");
      var h = '<button class="backbtn" onclick="go(\'khata\')">'+ic("back")+' '+esc(t("khata"))+'</button>';
      h += '<div class="detailhead"><div style="display:flex;align-items:center;gap:12px;justify-content:center"><span class="avatar" style="width:52px;height:52px;font-size:19px">'+esc(initials(partyLabel(p)))+'</span><div style="text-align:start"><div style="font-weight:800;font-size:18px">'+esc(partyLabel(p))+'</div><div class="num" style="color:var(--muted);font-size:13px">'+esc(p.phone||"")+' · '+esc(p.type==="customer"?t("customer"):t("supplier"))+'</div>'+((p.visitId||p.serialNo)?'<div class="num" style="color:var(--muted);font-size:13px">'+(p.visitId?esc(t("visitId"))+': '+esc(p.visitId):"")+((p.visitId&&p.serialNo)?' · ':"")+(p.serialNo?esc(t("serialNo"))+': '+esc(p.serialNo):"")+'</div>':"")+(patLines?'<div class="num" style="color:var(--muted);font-size:13px">'+patLines+'</div>':"")+'</div></div>'
        + '<div class="big num" style="margin-top:10px;color:'+(b===0?"var(--muted)":(positive?"var(--good)":"var(--danger)"))+'">'+(b===0?esc(t("settled")):fmt(Math.abs(b)))+'</div>'
        + (b!==0?'<div style="color:var(--muted);font-size:13px">'+esc(positive?t("willGet"):t("willGive"))+'</div>':"")
        + '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">'
        + ((canSee("waCall") && p.phone)?'<a class="btn sm ghost" style="text-decoration:none" href="tel:'+esc(p.phone)+'">'+ic("phone")+' '+esc(t("callNow"))+'</a>':"")
        + ((canSee("waCall") && p.phone)?'<button class="btn sm wa" onclick="sendWaSummary(\''+p.id+'\')">'+ic("wa")+' '+esc(t("waChat"))+'</button>':"")
        + (canEdit()?'<button class="btn sm ghost" onclick="partyForm(\''+p.id+'\')">'+esc(t("edit"))+'</button>':"")
        + ((canSee("waCall") && p.type==="customer" && b>0 && p.phone) ? '<button class="btn sm wa" onclick="sendReminder(\''+p.id+'\')">'+ic("wa")+' '+esc(t("remind"))+'</button>' : "")
        + (canSee("printPdf")?'<button class="btn sm ghost pdfbtn" onclick="printLedger()">'+esc(t("printLedger"))+'</button>':"")
        + (canSee("printPdf")?'<button class="btn sm ghost pdfbtn" onclick="shareCustomerPdf(\''+p.id+'\')">'+esc(t("sharePdf"))+'</button>':"")
        + '</div></div>';
      h += '<div class="grid2" style="margin-top:12px">'
        + (canEdit()?'<button class="btn danger" onclick="ptxForm(\''+p.id+'\',\'credit\')">'+ic("up")+' '+esc(p.type==="customer"?t("gaveCredit"):t("tookCredit"))+'</button>':"")
        + (canEdit()?'<button class="btn primary" onclick="ptxForm(\''+p.id+'\',\'pay\')">'+ic("down")+' '+esc(p.type==="customer"?t("gotPayment"):t("gavePayment"))+'</button>':"")
        + '</div>';
      h += '<div class="sec-title">'+esc(t("history"))+'</div><div class="card" style="padding:6px 16px">';
      if(!txs.length) h += '<div class="empty" style="padding:22px">'+esc(t("noTx"))+'</div>';
      txs.forEach(function(x){
        var isCredit = x.kind==="credit";
        var label = isCredit ? (p.type==="customer"?t("gaveCredit"):t("tookCredit")) : (p.type==="customer"?t("gotPayment"):t("gavePayment"));
        if(x.billId) label = t("billFrom")+" #"+(billById(x.billId)?billById(x.billId).no:"");
        h += '<div class="txrow"><span class="txdot '+(isCredit?"out":"in")+'">'+ic(isCredit?"up":"down")+'</span><span class="grow"><span class="tt">'+esc(label)+'</span><span class="ts num" style="display:block">'+dstr(x.date)+(x.note?' · '+esc(x.note):"")+'</span></span><span class="ta num" style="color:'+(isCredit?"var(--danger)":"var(--good)")+'">'+(isCredit?"+":"−")+' '+fmt(x.amount)+'</span>'+(canEdit()?'<button class="editbtn" onclick="ptxEdit(\''+x.id+'\',\''+p.id+'\')" aria-label="edit">'+ic("edit")+'</button>':"")+(canDelete()?'<button class="delbtn" onclick="ptxDelete(\''+x.id+'\',\''+p.id+'\')" aria-label="delete">'+ic("trash")+'</button>':"")+'</div>';

    function ptxForm(pid, kind){
      if(sharedMode && !canEdit()){ toast(t("shareNotAllowed")); return; }
      var p = partyById(pid);
      if(!p){ return; }
      var isCredit = kind==="credit";
      var title = isCredit ? (p.type==="customer"?t("gaveCredit"):t("tookCredit")) : (p.type==="customer"?t("gotPayment"):t("gavePayment"));
      /* v6.57 (Farman 2026-11-26): a customer's "Payment received" entry
         opens with the note already saying "Received" — that is the word
         Farman types himself every time. Suppliers get no pre-fill (their
         "pay" is "Payment given", not received). */
      var noteVal = (kind==="pay" && p.type==="customer") ? "Received" : "";
      openSheet(
        '<h2>'+esc(title)+'</h2><p class="hint">'+esc(p.name)+'</p>'
        + '<div class="field"><label>'+esc(t("amount"))+' *</label><div class="amtrow"><span class="rsprefix">Rs</span><input id="tx_amt" type="text" inputmode="none" readonly oninput="showCalcTotal(this.value,\'tx_total\')" onblur="amtKbBlur(this)">'+amtToggleBtnHtml("tx_amt")+'</div><div id="tx_total" class="calctotal"></div>' + txKeypadHtml() + '<div class="hint">'+esc(t("calcHint"))+'</div></div>' 
        + '<div class="frow"><div class="field"><label>'+esc(t("date"))+'</label><input id="tx_date" type="date" value="'+todayStr()+'"></div>'
        + '<div class="field"><label>'+esc(t("note"))+'</label><input id="tx_note" value="'+esc(noteVal)+'"></div></div>'
        + '<div class="actions"><button class="btn ghost" onclick="closeSheet()">'+esc(t("cancel"))+'</button><button class="btn primary" onclick="ptxSave(\''+pid+'\',\''+kind+'\')">'+esc(t("save"))+'</button></div>'
      );
      amtInitField("tx_amt");
      setTimeout(function(){ var i=document.getElementById("tx_amt"); if(i) i.focus(); }, 60);
    }
    function ptxSave(pid, kind){
      if(sharedMode && !canEdit()){ toast(t("shareNotAllowed")); return; }
      var amt = evalAmount(document.getElementById("tx_amt").value); if(isNaN(amt)) amt = 0;
      if(amt<=0){ toast(t("fillAmount")); return; }
      var p = partyById(pid);
      if(!p){ closeSheet(); return; }
      var tx = { id:uid(), partyId:pid, kind:kind, amount:amt, note:document.getElementById("tx_note").value.trim(), date:document.getElementById("tx_date").value||todayStr() };
      S.ptx.push(tx);

    /* v6.42 (Farman, 2026-11-17): serial SEQUENCES are separate per
       section — Khata parties take their own numbers, Cash Book
       parties theirs. v6.49 (Farman, 2026-11-19): SEQUENTIAL serials —
       within the Khata scope the numbers must be 1,2,3… with NO gaps,
       so nextSerialNo("khata") is the LOWEST MISSING positive integer
       in Khata scope (a gap left by a delete is filled before the
       sequence grows). Cash Book and no-scope callers keep the old
       highest + 1. A party in both scopes counts in both; suppliers
       count in both. Non-numeric/empty serials are ignored, as before. */
    function nextSerialNo(scope){
      if(scope === "khata"){
        var taken = {};
        S.parties.forEach(function(p){
          if(!partyInScope(p, scope)) return;
          var n = parseFloat(p.serialNo);
          if(!isNaN(n) && n > 0 && Math.floor(n) === n) taken[n] = true;
        });
        var m = 1;
        while(taken[m]) m++;
        return String(m);
      }
      var max = 0, found = false;
      S.parties.forEach(function(p){
        if(scope && !partyInScope(p, scope)) return;
        var n = parseFloat(p.serialNo);
        if(!isNaN(n) && n > max){ max = n; found = true; }
      });
      return found ? String(Math.floor(max)+1) : "1";
    }
    /* v6.42: the next serial for a party being (re)assigned — its own
       section's sequence when it lives in exactly one section, the
       global max+1 when it lives in both or is a supplier (a
       both-scopes serial must not collide in either section). */
    function nextSerialForParty(p){
      if(!p || p.type === "supplier") return nextSerialNo();
      var k = isKhataParty(p), c = isCashParty(p);
      if(k && !c) return nextSerialNo("khata");
      if(c && !k) return nextSerialNo("cash");
      return nextSerialNo();
    }

    /* v6.24: in-app calculator for EVERY amount field (Farman 2026-11-13).
       The phone keyboard must NOT pop up on its own: amount fields open
       in keypad mode — the input is readonly with inputmode="none" and
       the app's own keypad grid is shown. A visible toggle button next
       to the field switches to phone-keyboard mode (input editable,

    var amtKbMode = {};   /* input id -> "keypad" | "keyboard"; default keypad */
    function amtTotalFor(inpId){

    function amtKey(ch, inpId){
      var inp = document.getElementById(inpId); if(!inp) return;
      try{
        var pos = (typeof inp.selectionStart==="number") ? inp.selectionStart : inp.value.length;
        var end = (typeof inp.selectionEnd==="number") ? inp.selectionEnd : pos;
        inp.value = inp.value.slice(0,pos) + ch + inp.value.slice(end);
        try{ inp.setSelectionRange(pos+ch.length, pos+ch.length); }catch(e){}
      }catch(e){ inp.value = inp.value + ch; }
      amtTotalFor(inpId);
      try{ inp.focus(); }catch(e){}
    }
    function amtKeyEq(inpId){
      var inp = document.getElementById(inpId); if(!inp) return;
      var v = evalAmount(inp.value);
      if(!isNaN(v) && v>0){ inp.value = String(v); }
      amtTotalFor(inpId);
      try{ inp.focus(); }catch(e){}
    }
    function amtKeyClear(inpId){
      var inp = document.getElementById(inpId); if(!inp) return;
      inp.value = "";

      try{ inp.focus(); }catch(e){}

    function amtKeyBack(inpId){
      var inp = document.getElementById(inpId); if(!inp) return;
      try{
        var pos = (typeof inp.selectionStart==="number") ? inp.selectionStart : inp.value.length;
        var end = (typeof inp.selectionEnd==="number") ? inp.selectionEnd : pos;
        if(end>pos){ inp.value = inp.value.slice(0,pos) + inp.value.slice(end); try{ inp.setSelectionRange(pos, pos); }catch(e){} }
        else if(pos>0){ inp.value = inp.value.slice(0,pos-1) + inp.value.slice(pos); try{ inp.setSelectionRange(pos-1, pos-1); }catch(e){} }
      }catch(e){ inp.value = inp.value.slice(0,-1); }
      amtTotalFor(inpId);

    }

    function shareToggle(gid, key){

      var g = null;
      for(var i=0;i<myGrants.length;i++) if(myGrants[i].id===gid){ g = myGrants[i]; break; }
      if(!g) return;
      if(!g.toggles) g.toggles = shareToggles();
      g.toggles[key] = !g.toggles[key];
      db.collection("share_grants").doc(gid).set({ toggles:g.toggles }, {merge:true}).then(function(){ render(); }).catch(function(){ g.toggles[key] = !g.toggles[key]; toast(t("errUnknown")); });
    }
    function shareMaster(gid){
      if(!db) return;
      var g = null;
      for(var i=0;i<myGrants.length;i++) if(myGrants[i].id===gid){ g = myGrants[i]; break; }
      if(!g) return;
      g.active = !g.active;
      db.collection("share_grants").doc(gid).set({ active:g.active }, {merge:true}).then(function(){ render(); }).catch(function(){ g.active = !g.active; toast(t("errUnknown")); });
    }
    /* v6.25: per-party scoping for a grant. "All" clears the list
       (parties null = all parties, the old-grant default); "Selected"
       starts EMPTY (Farman 2026-11-13) — no party is ticked until the
       owner ticks it, so nobody is shared by accident. Re-clicking the
       mode the grant is already in changes nothing (an existing saved
       list is never reset). Toggling one party updates the stored
       list; a failed save reverts the local change so the checklist
       never lies. */
    function shareGrantById(gid){
      for(var i=0;i<myGrants.length;i++) if(myGrants[i].id===gid) return myGrants[i];
      return null;
    }
    function sharePartyMode(gid, mode){
      if(!db) return;
      var g = shareGrantById(gid); if(!g) return;
      var prev = g.parties;
      if(mode==="all") g.parties = null;
      else if(!g.parties) g.parties = [];
      if(g.parties === prev) return;
      db.collection("share_grants").doc(gid).set({ parties:g.parties }, {merge:true}).then(function(){ render(); }).catch(function(){ g.parties = prev; toast(t("errUnknown")); render(); });
    }
    /* v6.25: search inside a grant's Selected-parties checklist. The
       filter only HIDES rows in place (no re-render, so the input keeps
       focus and ticked boxes stay ticked while hidden); the query is
       kept in sharePartyQuery so a re-render (e.g. after ticking a box)
       restores it. */
    function sharePartySearch(inp, gid){
      sharePartyQuery[gid] = inp.value;
      applySharePartyFilter(gid);
    }
    function applySharePartyFilter(gid){
      var q = (sharePartyQuery[gid]||"").trim().toLowerCase();
      var list = document.querySelector('.cbplist[data-grant="'+gid+'"]');
      if(!list) return;
      var shown = 0;
      Array.prototype.forEach.call(list.querySelectorAll(".cbprow"), function(row){
        var ok = !q || row.textContent.toLowerCase().indexOf(q)>-1;
        row.style.display = ok ? "" : "none";
        if(ok) shown++;
      });
      var note = document.querySelector('.share-no-match[data-grant="'+gid+'"]');
      if(note) note.style.display = shown ? "none" : "block";
    }
    function sharePartyToggle(gid, pid){
      if(!db) return;
      var g = shareGrantById(gid); if(!g || !g.parties) return;
      var ix = g.parties.indexOf(pid);
      var wasOn = ix>-1;
      if(wasOn) g.parties.splice(ix, 1); else g.parties.push(pid);
      db.collection("share_grants").doc(gid).set({ parties:g.parties }, {merge:true}).then(function(){ render(); }).catch(function(){
        if(wasOn) g.parties.push(pid);
        else { var j=g.parties.indexOf(pid); if(j>-1) g.parties.splice(j,1); }
        toast(t("errUnknown")); render();
      });
    }

    function downloadBlob(blob, filename){
      /* Inside the Android app a blob: URL cannot be downloaded by the
         system DownloadManager, so hand the file to the native bridge
         (SafiKhataBridge.saveFile), which writes it to Downloads.
         In a normal browser fall back to the usual anchor download. */
      if(window.SafiKhataBridge && window.SafiKhataBridge.saveFile){
        var rd = new FileReader();
        rd.onload = function(){
          try{
            var b64 = String(rd.result).split(",")[1] || "";
            window.SafiKhataBridge.saveFile(filename, b64);
          }catch(e){ downloadBlobAnchor(blob, filename); }
        };
        rd.onerror = function(){ downloadBlobAnchor(blob, filename); };
        rd.readAsDataURL(blob);
        return;
      }
      downloadBlobAnchor(blob, filename);
    }
    function downloadPdfBlob(blob, filename){
      /* v6.20 — PDF downloads go through the native bridge's
         saveAndSharePdf (not saveFile): the Kotlin side writes the PDF
         to the PUBLIC Downloads folder with the correct application/pdf
         MIME type, verifies the write, toasts success ONLY when the
         file really landed, and then opens the share sheet for it. The
         native side owns all toasting on this path, so the HTML shows
         no toast here. Without a bridge (plain browser) fall back to
         the normal download, as before. */
      var b = window.SafiKhataBridge;
      if(b && typeof b.saveAndSharePdf === "function"){
        var rd = new FileReader();
        rd.onload = function(){
          try{
            var b64 = String(rd.result).split(",")[1] || "";
            b.saveAndSharePdf(filename, b64);
          }catch(e){ downloadBlob(blob, filename); toast(t("pdfDownloaded")); }
        };
        rd.onerror = function(){ downloadBlob(blob, filename); toast(t("pdfDownloaded")); };
        rd.readAsDataURL(blob);
        return;
      }
      downloadBlob(blob, filename);
    }
    function downloadBlobAnchor(blob, filename){
      var url;
      try{ url = URL.createObjectURL(blob); }catch(e){ return; }
      if(!url) return;
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
    }
    function downloadBackup(){
      var data = JSON.stringify({ app:"SafiKhata", version:1, exportedAt:new Date().toISOString(), data:S }, null, 2);
      downloadBlob(new Blob([data], {type:"application/json"}), "safi-khata-backup-"+todayStr()+".json");
    }
    function downloadAppFile(){
      var html = "<!doctype html>\n" + document.documentElement.outerHTML;
      downloadBlob(new Blob([html], {type:"text/html"}), "safi-khata.html");
      toast(t("saved"));
    }
    document.getElementById("importFile").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      if(!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var j = JSON.parse(rd.result);
          var d = j && j.data ? j.data : j;
          if(!d || !Array.isArray(d.parties) || !Array.isArray(d.bills)) throw new Error("bad");
          S = Object.assign(DEF(), d);
          if(!S.settings) S.settings = DEF().settings;
          if(!Array.isArray(S.trash)) S.trash = [];
          /* v6.23: migrate scopes on imported data before saving. */
          ensureScopesMigrated();
          save(); toast(t("restored")); go("home");
        }catch(err){ toast(t("invalidBackup")); }
      };
      rd.readAsText(f);
    });
    /* v6.35: Erase all data asks TWICE (Farman). The first confirm is
       the old one; tapping Delete there opens a second confirm — only
       the second Delete erases. A single tap/confirm never erases. */
    function eraseAll(){
      openSheet('<h2>'+esc(t("erase"))+'</h2><p class="hint">'+esc(t("eraseConfirm"))+'</p><div class="actions"><button class="btn ghost" onclick="closeSheet()">'+esc(t("cancel"))+'</button><button class="btn danger" onclick="eraseAllStep2()">'+esc(t("delete"))+'</button></div>');
    }
    function eraseAllStep2(){
      openSheet('<h2>'+esc(t("erase"))+'</h2><p class="hint">'+esc(t("eraseConfirm2"))+'</p><div class="actions"><button class="btn ghost" onclick="closeSheet()">'+esc(t("cancel"))+'</button><button class="btn danger" onclick="eraseDo()">'+esc(t("delete"))+'</button></div>');
    }
    function eraseDo(){
      /* v6.46: DATA SEPARATION — Erase All wipes the KHATA record only.
         The Cash Book slice (ctx entries, cash-only parties, custom
         categories, cash trash items) and the migration marker survive:
         they belong to the Cash Book app now. A "both" party keeps its
         cash side and becomes cash-only. */
      var keepCtx = Array.isArray(S.ctx) ? S.ctx : [];
      var keepCats = Array.isArray(S.customCats) ? S.customCats : [];
      var keepMarker = S.cashbookMigrated === true;
      var keepMarkerAt = S.cashbookMigratedAt || 0;
      var keepParties = [];
      S.parties.forEach(function(p){
        if(p.createdIn==="cash"){ keepParties.push(p); }
        else if(p.createdIn==="both"){ var c = trashClone(p); c.createdIn = "cash"; keepParties.push(c); }
      });
      var keepTrash = [];
      (S.trash||[]).forEach(function(it){
        if(trashIsCashOnly(it)){ keepTrash.push(it); return; }
        if(trashHasCash(it)){
          var m = trashClone(it);
          m.ptx = [];
          m.ctx = Array.isArray(m.ctx) ? m.ctx : [];
          if(m.party && m.party.createdIn==="both") m.party.createdIn = "cash";
          keepTrash.push(m);
        }
      });
      S = DEF();
      S.ctx = keepCtx;
      S.customCats = keepCats;
      S.parties = keepParties;
      S.trash = keepTrash;
      S.cashbookMigrated = keepMarker;
      S.cashbookMigratedAt = keepMarkerAt;
      save(); closeSheet(); toast(t("deleted")); go("home");
    }

    /* ---------- header wiring + init ---------- */
    document.getElementById("langToggle").addEventListener("click", function(){
      var nl = (L()==="ur") ? "en" : "ur";
      if(sharedMode){
        /* v6.7: in shared mode the language is the viewer's own choice —
           it must never be written into the owner's settings. */
        sharedLang = nl;
        try{ localStorage.setItem("safiKhataSharedLang", nl); }catch(e){}
        render(); return;
      }
      S.settings.lang = nl;
      save(); render();
      if(!currentUser) renderAuth();
    });
    document.getElementById("settingsBtn").addEventListener("click", function(){ go("settings"); });
    startApp();
</script>
  </body>
</html>
